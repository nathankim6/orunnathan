# 정적 HTML 앱들을 GitHub Pages 로 올린다.
# orun-oracle.html 은 출제자 성향 프로파일러(ORUN ORACLE) — 한 벌뿐이고 제 이름으로 나간다.
# 생성기는 public/mocktest-generator.html 한 벌뿐이고, 여기서 index.html ·
# mocktest-generator.html · mock-exam.html 세 이름으로 함께 내보낸다.
# (예전에 사본을 두 벌 두던 때가 있어 주소가 셋이다 — 주소는 지키고 파일만 하나로 줄였다.)
# Pages 는 gh-pages 브랜치를 소스로 읽는다. 그 브랜치에는 여기 나열한 파일만 둔다 —
# 저장소의 나머지는 웹으로 열리지 않는다.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/mocktest-generator.html'
      - 'public/orun-universe.html'
      - 'public/orun-grammar.html'
      - 'public/studio.html'
      - 'public/orun-oracle.html'
      - 'public/three.min.js'
      - 'public/orun-universe-poster.jpg'
      - 'tools/orun-bridge.mjs'
      - 'tools/orun-connect.cmd'
      - 'tools/orun-connect.command'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 정적 앱을 gh-pages 로 올린다
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 작업트리를 갈아엎지 않고 배관으로 커밋을 짓는다 — 저장소가 크다
          mock=$(git hash-object -w public/mocktest-generator.html)
          uni=$(git hash-object -w public/orun-universe.html)
          gram=$(git hash-object -w public/orun-grammar.html)
          stud=$(git hash-object -w public/studio.html)
          orac=$(git hash-object -w public/orun-oracle.html)
          three=$(git hash-object -w public/three.min.js)
          post=$(git hash-object -w public/orun-universe-poster.jpg)
          # 구독 연결용 로컬 중계소 — 선생님이 내려받아 이 컴퓨터에서 돌린다.
          # 사본을 만들지 않고 tools/ 의 원본을 그대로 내보낸다.
          brdg=$(git hash-object -w tools/orun-bridge.mjs)
          # 더블클릭 런처 — 선생님이 받아서 두 번 누르는 파일
          cwin=$(git hash-object -w tools/orun-connect.cmd)
          cmac=$(git hash-object -w tools/orun-connect.command)
          # 맥은 내려받은 파일에 실행 권한이 없어 두 번 눌러도 열리지 않는다.
          # zip 은 유닉스 권한을 품으므로 압축만 풀면 바로 실행된다.
          # 날짜를 고정해 zip 이 매번 같은 바이트가 되게 한다 — 안 그러면
          # 바뀐 것이 없어도 트리가 달라져 매 푸시마다 다시 배포된다.
          rm -rf /tmp/orunzip && mkdir -p /tmp/orunzip
          cp tools/orun-connect.command /tmp/orunzip/
          chmod 755 /tmp/orunzip/orun-connect.command
          touch -t 202601010000 /tmp/orunzip/orun-connect.command
          (cd /tmp/orunzip && zip -q -X orun-connect-mac.zip orun-connect.command)
          czip=$(git hash-object -w /tmp/orunzip/orun-connect-mac.zip)
          # index.html 은 지금까지처럼 생성기다. 나머지는 제 이름으로 나란히 선다.
          tree=$(printf '100644 blob %s\tindex.html\n100644 blob %s\tmocktest-generator.html\n100644 blob %s\torun-universe.html\n100644 blob %s\torun-grammar.html\n100644 blob %s\tmock-exam.html\n100644 blob %s\tstudio.html\n100644 blob %s\torun-oracle.html\n100644 blob %s\tthree.min.js\n100644 blob %s\torun-universe-poster.jpg\n100644 blob %s\torun-bridge.mjs\n100644 blob %s\torun-connect.cmd\n100755 blob %s\torun-connect.command\n100644 blob %s\torun-connect-mac.zip\n' \
                 "$mock" "$mock" "$uni" "$gram" "$mock" "$stud" "$orac" "$three" "$post" "$brdg" "$cwin" "$cmac" "$czip" | git mktree)

          git fetch --no-tags --depth=1 origin gh-pages || true
          parent=$(git rev-parse -q --verify FETCH_HEAD || true)

          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "바뀐 것이 없습니다 — 그대로 둡니다."
            exit 0
          fi

          msg="정적 앱 배포 ${GITHUB_SHA:0:7}"
          if [ -n "$parent" ]; then
            commit=$(git commit-tree "$tree" -p "$parent" -m "$msg")
          else
            commit=$(git commit-tree "$tree" -m "$msg")
          fi
          git push origin "$commit:refs/heads/gh-pages"
          echo "https://nathankim6.github.io/orunnathan/ 로 올렸습니다."

<style>
/* ==================================================================
   ORUN ORACLE — 셸 스타일 (spec §6). 어두운 화면 · 글 중심 · 유리/글로우는 .hud(브레인 뷰)에만.
   토큰 §6.2 · 타이포 §6.3 · 컴포넌트 §6.5 · 반응형 §6.6 · 인쇄 §3.13-4 · 접근성 §6.7
   ================================================================== */
:root {
  /* 표면 */
  --bg: #0b1020;  --bg2: #0e1526;  --surface: #131c31;  --surface2: #18233b;
  --line: rgba(148,178,220,.14);  --line2: rgba(148,178,220,.32);
  /* 글 */
  --ink: #e6edf7;  --dim: #a9b8cc;  --faint: #8ea0b8;   /* --faint 는 --bg 7.1:1 · 카드(--surface) 6.4:1 · .ncard.new 겹침 4.5:1 — 어디에 놓아도 AA */
  /* 강조 — 홀로 청록은 링크 · 포커스 · 활동에만 */
  --holo: #5fc8ff;  --holo2: #9fe3ff;  --holo-soft: rgba(95,200,255,.14);
  --gold: #f5c518;  --ok: #46f0c5;  --bad: #ff6b7a;  --warn: #ffb454;
  --new: rgba(95,200,255,.16);            /* 24시간 안에 들어온 것 */
  /* 브레인 뷰 HUD 전용 (옛 이름 유지) */
  --void: #030812; --void2: #061024; --ice: #cfefff; --glass: rgba(6,18,40,.62); --glass2: rgba(6,16,36,.86);
  --line-hot: rgba(95,200,255,.55);
  /* 글꼴 */
  --f: 'Orbitron', 'Noto Sans KR', 'Noto Sans', system-ui, sans-serif;   /* body — 규칙: 영문 Orbitron */
  --fk: 'Noto Sans KR', 'Noto Sans', system-ui, sans-serif;               /* 본문 · 입력 · 버튼 */
  /* 간격 · 모서리 · 그림자 · 모션 */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r-card: 10px; --r-input: 8px; --r-chip: 999px; --r-hud: 14px; --r: 14px;
  --shadow-pop: 0 12px 40px rgba(0,0,0,.5);
  --t-fast: 120ms; --t-mid: 180ms; --t-view: 240ms; --ease: cubic-bezier(.2,.8,.2,1);
  --nav: 240px; --nav-min: 56px; --aside: 320px; --top: 48px; --status: 28px; --tab: 56px; --read: 760px;
  --nav-w: var(--nav); --aside-w: var(--aside);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 13px; line-height: 1.55; overflow: hidden; }
body { -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: var(--top) minmax(0, 1fr) var(--status); grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--aside-w); }
body.navClosed { --nav-w: var(--nav-min); }
body.asideClosed { --aside-w: 0px; }
body.brainView { --aside-w: 0px; }
body.brainFull { grid-template-rows: 0 minmax(0, 1fr) 0; grid-template-columns: 0 minmax(0, 1fr) 0; }
button, input, select, textarea { font: inherit; color: inherit; }
#main, #nav, #aside, #cmdk, #sheetBody, #toasts, #statusbar, #tabbar, #acPop, #bootError, button, input, select, textarea { font-family: var(--fk); }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r-input); padding: 6px 12px; min-height: 32px; white-space: nowrap; flex: none; transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast); letter-spacing: .01em; }
button:hover { border-color: var(--line2); background: var(--surface2); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
button.pri { background: rgba(95,200,255,.15); border-color: var(--holo); color: var(--holo2); }
button.pri:hover { background: rgba(95,200,255,.24); }
button.ghost { background: transparent; }
button.link { background: transparent; border: 0; color: var(--holo2); padding: 2px 4px; min-height: 0; text-decoration: underline dotted; }
button.danger { border-color: rgba(255,107,122,.5); color: #ffb3bb; }
button.icon { padding: 0; width: 32px; min-width: 32px; display: inline-grid; place-items: center; }
button svg, .ic svg, .nav-item svg, .tab svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
input[type=text], input[type=password], input[type=number], input[type=email], input[type=date], input[type=search], select, textarea { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r-input); padding: 7px 10px; color: var(--ink); width: 100%; outline: none; font-family: var(--fk); min-height: 32px; }
input:focus, select:focus, textarea:focus { border-color: var(--holo); box-shadow: 0 0 0 2px rgba(95,200,255,.18); }
textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
input[type=checkbox], input[type=radio] { width: auto; min-height: 0; accent-color: var(--holo); }
input[type=range] { width: 100%; accent-color: var(--holo); }
a { color: var(--holo2); }
:focus-visible { outline: 2px solid var(--holo); outline-offset: 2px; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: rgba(148,178,220,.22); border-radius: 8px; }
[hidden] { display: none !important; }
mark { background: rgba(245,197,24,.35); color: inherit; border-radius: 2px; padding: 0 1px; }
kbd { font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: .04em; padding: 1px 6px; border: 1px solid var(--line2); border-radius: 4px; background: var(--surface); color: var(--dim); }

/* ── 공용 유틸 ── */
.small { font-size: 11.5px; color: var(--dim); } .faint { color: var(--faint); }
.en, .num { font-family: 'Orbitron', sans-serif; letter-spacing: .04em; } .en { letter-spacing: .12em; text-transform: uppercase; font-size: 11px; }
.num { font-size: 11.5px; font-weight: 500; }
.mono { font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: .04em; }
.kicker { font-family: 'Orbitron', sans-serif; font-weight: 500; font-size: 10px; line-height: 1; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
.view-title { font-family: var(--fk); font-weight: 600; font-size: 15px; margin: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .grow { flex: 1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; }
.kv b { font-weight: 500; color: var(--dim); font-size: 11.5px; letter-spacing: .04em; }
.gold { color: var(--gold); } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.sec { margin: 0 0 var(--s5); } .sec h4 { margin: 0 0 8px; font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: .22em; color: var(--dim); font-weight: 500; text-transform: uppercase; }
.sec h4 span { float: right; letter-spacing: .02em; text-transform: none; color: var(--faint); font-family: var(--fk); }
.ph { display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; border-bottom: 1px solid var(--line); font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: .22em; color: var(--dim); text-transform: uppercase; }
.ph .grow { flex: 1; } .ph button { padding: 2px 8px; font-size: 10px; min-height: 24px; letter-spacing: .04em; }
.pb { padding: 12px 14px; overflow: auto; }
.narr { font-size: 14px; line-height: 1.7; color: var(--ink); font-family: var(--fk); }
.note-body { font-size: 14px; line-height: 1.7; }
.note { font-size: 11.5px; color: var(--faint); line-height: 1.6; border-left: 2px solid var(--line2); padding-left: 8px; margin: 6px 0; font-family: var(--fk); }
.empty { padding: 24px 12px; text-align: center; color: var(--faint); font-size: 12px; line-height: 1.7; font-family: var(--fk); }
.empty b { display: block; color: var(--dim); font-weight: 500; margin-bottom: 4px; }
.empty button { margin-top: 8px; }
.memo { font-family: var(--fk); font-size: 11.5px; color: var(--gold); opacity: .9; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
.err { color: #ffb3bb; font-size: 11.5px; margin-top: 6px; }
.check { list-style: none; padding: 0; margin: 6px 0 0; font-size: 12px; color: var(--dim); } .check li::before { content: "☐ "; color: var(--faint); } .check li.on::before { content: "☑ "; color: var(--ok); } .check li.on { color: var(--ink); }
.irow { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px 10px; align-items: center; padding: 4px 4px; border-radius: 8px; }
.irow.btn { cursor: pointer; } .irow.btn:hover { background: var(--holo-soft); }
.irow .ic { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; color: var(--holo2); background: var(--surface); }
.irow .lb { font-family: var(--fk); font-size: 12.5px; color: var(--ink); } .irow .lb small { display: block; font-size: 10.5px; color: var(--faint); }
.irow .st { font-family: 'Orbitron', sans-serif; font-size: 9.5px; letter-spacing: .14em; color: var(--ok); }
.irow .st.off { color: var(--faint); } .irow .st.busy { color: var(--holo2); animation: blink 1s infinite; } .irow .st.warn { color: var(--gold); }
@keyframes blink { 50% { opacity: .35; } }

/* ── 컴포넌트: 카드 · 칩 · 배지 · 모노그램 · 지표 · 막대 · 표 · 속성 ── */
.card { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); padding: var(--s4); }
.card.new, .new { background: linear-gradient(0deg, var(--new), var(--new)), var(--surface); }
.card + .card { margin-top: var(--s3); }
.cards { display: grid; gap: var(--s3); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 9px; min-height: 22px; border-radius: 8px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); white-space: nowrap; font-family: var(--fk); cursor: default; }
button.chip { cursor: pointer; } button.chip:hover { border-color: var(--holo); }
.chip.on { border-color: var(--holo); color: var(--holo2); background: var(--holo-soft); }
.chip.gold { border-color: rgba(245,197,24,.5); color: var(--gold); background: rgba(245,197,24,.08); }
.chip.dim { border-color: var(--line); color: var(--dim); background: transparent; }
.chip.derived { border-style: dashed; color: var(--dim); background: transparent; }
.chip.tag, .tag { border-radius: var(--r-chip); color: var(--holo2); text-decoration: none; }
a.chip.tag::before, .tag::before { content: "#"; opacity: .7; }
.badge { font-size: 9.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line2); color: var(--dim); align-self: start; white-space: nowrap; font-family: 'Orbitron', sans-serif; letter-spacing: .06em; }
.badge.ok { border-color: rgba(70,240,197,.45); color: var(--ok); } .badge.warn { border-color: rgba(245,197,24,.5); color: var(--gold); } .badge.bad { border-color: rgba(255,107,122,.5); color: var(--bad); }
.mono-kind { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--surface2); color: var(--dim); font-size: 10.5px; font-family: var(--fk); font-weight: 500; flex: none; }
.mono-kind[data-kind]::before { content: attr(data-kind); }
.mono-kind[data-kind=exam]::before { content: "시"; } .mono-kind[data-kind=question]::before { content: "문"; } .mono-kind[data-kind=passage]::before { content: "지"; } .mono-kind[data-kind=source]::before { content: "자"; }
.mono-kind[data-kind=handout]::before { content: "프"; } .mono-kind[data-kind=profile]::before { content: "프"; } .mono-kind[data-kind=prediction]::before { content: "예"; } .mono-kind[data-kind=mock]::before { content: "모"; }
.mono-kind[data-kind=note]::before { content: "메"; } .mono-kind[data-kind=ask]::before { content: "질"; } .mono-kind[data-kind=teacher]::before { content: "선"; } .mono-kind[data-kind=tag]::before { content: "#"; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); min-width: 0; }
.stat b { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.1; color: var(--ink); }
.stat span { font-size: 11.5px; color: var(--dim); }
.stat.pulse b { animation: pulse 400ms var(--ease) 1; }
@keyframes pulse { 30% { color: var(--holo2); transform: scale(1.06); } }
.bar { height: 5px; background: rgba(148,178,220,.12); border-radius: 4px; overflow: hidden; margin: 3px 0 8px; }
.bar > i { display: block; height: 100%; background: var(--holo); border-radius: 4px; transition: width .8s var(--ease); }
.bar.gold > i { background: var(--gold); }
.bar.prog > i { box-shadow: 0 0 10px rgba(95,200,255,.6); }
.dist { display: grid; grid-template-columns: 5.4em 1fr 3.2em; gap: 4px 8px; align-items: center; font-size: 12px; }
.dist .bar { margin: 0; } .dist i.n { text-align: right; font-style: normal; font-family: 'Orbitron', monospace; font-size: 10px; color: var(--dim); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; height: 36px; }
.tbl th { color: var(--dim); font-weight: 500; font-size: 10px; letter-spacing: .08em; font-family: 'Orbitron', sans-serif; white-space: nowrap; }
.tbl th[data-sort] { cursor: pointer; user-select: none; } .tbl th[data-sort]:hover { color: var(--ink); }
.tbl th[data-sort].asc::after { content: " ↑"; } .tbl th[data-sort].desc::after { content: " ↓"; }
.tbl tr.rowbtn { cursor: pointer; } .tbl tr.rowbtn:hover td { background: var(--holo-soft); }
.tbl td.edit, .props td.edit, .edit { text-decoration: underline dotted var(--line2); text-underline-offset: 3px; cursor: text; }
.tbl td.num, .tbl th.num { font-family: 'Orbitron', sans-serif; font-size: 11.5px; }
.tblwrap { overflow-x: auto; max-width: 100%; }
table.props { width: 100%; border-collapse: collapse; font-size: 13px; }
table.props th { text-align: left; color: var(--dim); font-weight: 400; font-size: 11.5px; width: 7em; padding: 4px 8px 4px 0; vertical-align: top; white-space: nowrap; }
table.props td { padding: 4px 0; vertical-align: top; }
table.props tr + tr th, table.props tr + tr td { border-top: 1px solid var(--line); }
table.props input, table.props select { width: auto; min-width: 80px; padding: 3px 8px; min-height: 28px; }
table.props .seg button { min-height: 26px; padding: 2px 8px; }
details.raw summary { cursor: pointer; color: var(--dim); font-size: 12px; }
details.raw pre { white-space: pre-wrap; font-size: 12px; color: var(--dim); max-height: 320px; overflow: auto; background: var(--bg2); padding: 10px; border-radius: 8px; font-family: var(--fk); line-height: 1.6; }
.tl { display: flex; flex-direction: column; gap: 4px; }
.tl .it { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 12.5px; transition: border-color var(--t-fast); }
.tl .it:hover { border-color: var(--line2); } .tl .it .t { color: var(--ink); } .tl .it .s { color: var(--faint); font-size: 11px; grid-column: 1 / -1; }
.tlist { display: flex; flex-direction: column; gap: 4px; }
.tlist .it { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; cursor: pointer; background: var(--surface); }
.tlist .it:hover { border-color: var(--line2); }
.tlist .dot, .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.flist { max-height: 38vh; overflow: auto; }
.hot { display: grid; grid-template-columns: 3.6em 1fr; gap: 3px 8px; font-size: 12.5px; align-items: center; margin-bottom: 4px; cursor: pointer; }
.hot .p { font-family: 'Orbitron', monospace; font-size: 10.5px; color: var(--gold); text-align: right; } .hot .t { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hot .w { grid-column: 1 / -1; } .hot:hover .t { color: var(--holo2); }
.why { font-size: 10.5px; color: var(--faint); grid-column: 1 / -1; padding-left: 4px; }
.ncard { display: grid; grid-template-columns: 24px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); cursor: pointer; text-decoration: none; color: inherit; }
.ncard:hover { border-color: var(--line2); } .ncard .t { font-size: 13px; color: var(--ink); } .ncard .s { grid-column: 2 / -1; font-size: 11.5px; color: var(--faint); }
.ncard.new { background: linear-gradient(0deg, var(--new), var(--new)), var(--surface); }
.todo { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; margin-bottom: 6px; }
.todo span { flex: 1; } .todo button { min-height: 28px; padding: 3px 10px; }
canvas.spark { width: 100%; height: 36px; display: block; }
.q { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; font-size: 12.5px; background: var(--surface); }
.q .n { color: var(--ink); } .q .d { grid-column: 1 / -1; color: var(--dim); font-size: 11.5px; }
.q .prog { grid-column: 1 / -1; } .q .x { padding: 0 6px; font-size: 11px; min-height: 24px; }
.q.err { border-color: rgba(255,107,122,.45); }
.msg { padding: 10px 12px; border-radius: var(--r-card); margin-bottom: 8px; font-size: 14px; line-height: 1.7; max-width: var(--read); }
.msg.me { background: var(--surface2); margin-left: 40px; } .msg.brain { background: var(--surface); border: 1px solid var(--line); }
.cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 6px; border: 1px solid var(--holo); background: var(--holo-soft); color: var(--holo2); font-family: 'Orbitron', sans-serif; font-size: 9.5px; cursor: pointer; vertical-align: 2px; margin: 0 1px; }
.cite.unused { opacity: .45; } .cite.dashed { border-style: dashed; color: var(--faint); background: transparent; }
.followup { margin: 4px 6px 4px 0; min-height: 28px; font-size: 12px; }
.tlDay { margin-bottom: var(--s4); } .tlDay h5 { margin: 0 0 6px; font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: .18em; color: var(--dim); font-weight: 500; }
.ev { display: grid; grid-template-columns: 3.4em 20px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
.ev:hover { background: var(--holo-soft); } .ev .num { color: var(--faint); }
a[data-link], a.wiki { color: var(--holo2); text-decoration: none; border-bottom: 1px solid rgba(95,200,255,.35); }
a.broken, .broken { color: var(--faint); border-bottom: 1px dashed var(--faint); cursor: pointer; }
blockquote { margin: 6px 0; padding: 4px 12px; border-left: 2px solid var(--line2); color: var(--dim); }

/* ── 앱 골격: 상단 ── */
#topbar { grid-row: 1; grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--bg2); min-width: 0; z-index: 20; }
#brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
#brand b { font-family: 'Orbitron', sans-serif; font-weight: 800; letter-spacing: .28em; font-size: 14px; color: #fff; white-space: nowrap; }
#brandSub { font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; font-size: 12px; color: var(--dim); white-space: nowrap; }
#crumbs a { color: var(--dim); text-decoration: none; cursor: pointer; overflow: hidden; text-overflow: ellipsis; max-width: 240px; } #crumbs a:hover { color: var(--ink); }
#crumbs a:last-child { color: var(--ink); } #crumbs i { font-style: normal; color: var(--faint); }
#btnSearch { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--dim); background: var(--surface); min-width: 220px; max-width: 360px; flex: 1; justify-content: flex-start; font-size: 12px; }
#btnSearch kbd { margin-left: auto; }
#engine, #cloud { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--dim); padding: 4px 10px; min-height: 26px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: 'Orbitron', sans-serif; letter-spacing: .1em; white-space: nowrap; }
#engine i, #cloud i { width: 7px; height: 7px; border-radius: 50%; background: #555; transition: all .3s; }
#engine.ok i, #cloud.ok i { background: var(--ok); box-shadow: 0 0 8px var(--ok); } #engine.fail i, #cloud.fail i { background: var(--bad); box-shadow: 0 0 8px var(--bad); } #engine.busy i, #cloud.busy i { background: var(--holo); box-shadow: 0 0 8px var(--holo); animation: blink 1s infinite; }
#fpsTag { font-family: 'Orbitron', monospace; font-size: 10px; color: var(--faint); }
#btnHelp, #btnSettings, #asideToggle, #navToggle { min-width: 32px; padding: 0 8px; }

/* ── 왼쪽 #nav ── */

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>옳은영어 · 동작구 고교 입시 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1A2A; --navy2:#102B42; --accent:#C8962E; --accent-soft:#E4C277;
    --glow:rgba(228,194,119,.50); --cream:#F6F1E7; --paper:#FBF8F1; --ink:#16212B; --slate:#5A6B79;
    --line:#E2DACB; --line-d:#cfc6b2; --heat0:#EFE9DC;
    --sans:'Noto Sans KR','Noto Sans',-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans); color:var(--ink); background:#E7E0D2; -webkit-font-smoothing:antialiased; overflow-x:hidden}
  /* top bar */
  .bar{position:sticky; top:0; z-index:30; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:13px 26px; border-bottom:2px solid var(--accent)}
  .bar .b-l{display:flex; align-items:center; gap:12px}
  .bar .logo{height:34px; width:auto; display:flex; align-items:center}
  .bar .logo img,.bar .logo svg{height:34px; width:auto; display:block}
  .bar .wm{font-weight:800; font-size:17px; letter-spacing:.3px; line-height:1}
  .bar .wm small{display:block; font-weight:600; font-size:9px; letter-spacing:3px; color:var(--accent-soft); margin-top:3px}
  .bar .acts{display:flex; gap:9px}
  .btn{font-family:var(--sans); font-weight:700; font-size:12.5px; padding:9px 16px; border-radius:8px; border:1px solid rgba(255,255,255,.25); background:transparent; color:#fff; cursor:pointer; transition:.15s; display:flex; align-items:center; gap:7px}
  .btn:hover{background:rgba(255,255,255,.12)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn svg{width:15px;height:15px}

  .stage{padding:34px 26px 90px; display:flex; flex-direction:column; align-items:center; gap:26px}
  .slide-frame{width:100%; max-width:1060px; position:relative; box-shadow:0 18px 50px -22px rgba(11,26,42,.45),0 2px 8px rgba(0,0,0,.06); border-radius:7px; overflow:hidden; background:#fff}
  .slide-scaler{transform-origin:top left}
  .slide{width:1280px; height:720px; position:relative; overflow:hidden; font-family:var(--sans); color:var(--ink); background:var(--paper)}

  /* common content frame */
  .s-mark{position:absolute; top:44px; left:80px; display:flex; align-items:center; gap:10px; z-index:3}
  .s-mark .lg img,.s-mark .lg svg{height:26px;width:auto;display:block}
  .s-mark b{font-weight:800; font-size:15px; color:var(--navy); letter-spacing:.2px}
  .s-mark b small{font-weight:600; font-size:8px; letter-spacing:2.5px; color:var(--accent); display:block; margin-top:2px}
  .s-tag{position:absolute; top:48px; right:80px; font-size:11.5px; letter-spacing:3px; color:var(--slate); font-weight:700}
  .s-num{position:absolute; bottom:40px; right:80px; font-size:12.5px; color:#b3a98f; font-weight:600}
  .s-rule{position:absolute; bottom:36px; left:80px; right:130px; height:1px; background:var(--line)}
  .s-body{position:absolute; top:120px; left:80px; right:80px; bottom:55px}
  .eyebrow{display:flex; align-items:center; gap:12px; margin-bottom:13px}
  .eyebrow i{width:28px;height:2px;background:var(--accent);display:block}
  .eyebrow span{font-size:12px; letter-spacing:3px; font-weight:800; color:var(--accent)}
  .s-head{font-weight:800; font-size:38px; color:var(--navy); line-height:1.16; letter-spacing:-.5px}
  .s-head em{font-style:normal; color:var(--accent)}
  .s-sub{font-size:15px; color:var(--slate); margin-top:9px; line-height:1.6}

  /* cover */
  .slide.dark{background:var(--navy); color:#fff}
  .beam{position:absolute; inset:0; background:radial-gradient(circle at 84% 14%, var(--glow), transparent 40%), radial-gradient(circle at 78% 6%, var(--glow), transparent 60%); opacity:.9}
  .beam2{position:absolute; top:-140px; right:70px; width:520px; height:1000px; background:linear-gradient(180deg,var(--glow),transparent 72%); transform:rotate(20deg); filter:blur(40px); opacity:.5}
  .cover-wrap{position:absolute; inset:0; padding:0 96px; display:flex; flex-direction:column; justify-content:center; z-index:2}
  .cover-eyebrow{display:flex; align-items:center; gap:13px; margin-bottom:22px}
  .cover-eyebrow i{width:46px; height:2px; background:var(--accent)}
  .cover-eyebrow span{letter-spacing:5px; font-size:13px; font-weight:800; color:var(--accent-soft)}
  .cover-title{font-weight:900; font-size:64px; line-height:1.08; letter-spacing:-1.5px}
  .cover-sub{font-weight:600; font-size:25px; color:var(--accent-soft); margin-top:16px}
  .cover-brand{position:absolute; bottom:60px; left:96px; display:flex; align-items:center; gap:13px; z-index:2}
  .cover-brand .lg img,.cover-brand .lg svg{height:42px;width:auto;display:block}
  .cover-brand .cb-t{font-weight:800; font-size:21px}
  .cover-brand .cb-t small{display:block; font-weight:600; font-size:9px; letter-spacing:4px; color:var(--accent); margin-top:3px}
  .cover-date{position:absolute; bottom:66px; right:96px; text-align:right; color:#9fb0c0; font-size:13px; z-index:2}
  /* light cover (brand with full logo) */
  .slide.lightc{background:linear-gradient(135deg,#FFFDF8,#F4EEE2)}
  .slide.lightc .lglow{position:absolute; top:-160px; right:-120px; width:620px; height:620px; background:radial-gradient(circle,var(--glow),transparent 66%); pointer-events:none}
  .slide.lightc .cover-wrap{z-index:2}
  .slide.lightc .lc-logo img{filter:drop-shadow(0 8px 22px rgba(15,39,66,.14))}
  .slide.lightc .cover-eyebrow i{background:var(--accent)}

  /* overview cards */
  .ov-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:6px}
  .ov-card{background:#fff; border:1px solid var(--line); border-radius:13px; padding:18px 17px; box-shadow:0 8px 22px -18px rgba(11,26,42,.4); position:relative; overflow:hidden}
  .ov-card .top{height:3px; position:absolute; top:0; left:0; right:0; background:linear-gradient(90deg,var(--accent),var(--accent-soft))}
  .ov-card .nm{font-weight:800; font-size:20px; color:var(--navy)}
  .ov-card .ty{display:inline-block; margin-top:9px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--navy); color:#fff; letter-spacing:.3px}
  .ov-card .ty.sa{background:var(--accent)}
  .ov-card .me{margin-top:11px; font-size:12.5px; color:var(--slate); line-height:1.5}
  .ov-intro{margin-top:20px; background:rgba(0,0,0,.025); border-left:3px solid var(--accent); padding:15px 18px; border-radius:0 8px 8px 0; font-size:14px; color:#4f5d68; line-height:1.65}

  /* bar chart */
  .bars{display:flex; flex-direction:column; gap:13px; margin-top:4px}
  .brow{display:grid; grid-template-columns:30px 128px 1fr 86px; align-items:center; gap:14px}
  .brow .rk{width:26px; height:26px; border-radius:50%; background:var(--heat0); color:var(--slate); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center}
  .brow:nth-child(1) .rk,.brow.top .rk{background:var(--accent); color:#fff}
  .brow .nm{font-weight:700; font-size:16px; color:var(--navy)}
  .brow .nm small{display:block; font-weight:500; font-size:11px; color:#9aa6b0; margin-top:1px}
  .track{height:26px; background:var(--heat0); border-radius:7px; overflow:hidden}
  .fill{height:100%; border-radius:7px; background:linear-gradient(90deg,var(--navy),var(--navy2)); min-width:2px; transition:width .3s}
  .fill.acc{background:linear-gradient(90deg,var(--accent),var(--accent-soft))}
  .brow .val{text-align:right; font-weight:800; font-size:18px; color:var(--navy); font-variant-numeric:tabular-nums}
  .callout{display:block; margin-top:20px; background:var(--navy); color:#fff; padding:14px 20px; border-radius:12px; font-size:14px; line-height:1.55; box-shadow:0 12px 30px -18px rgba(0,0,0,.45)}
  .callout b{color:var(--accent-soft)}

  /* subject table */
  table.cmp{width:100%; border-collapse:collapse; margin-top:6px; font-variant-numeric:tabular-nums}
  table.cmp th,table.cmp td{padding:11px 10px; text-align:center; font-size:14.5px}
  table.cmp th{font-size:12px; letter-spacing:1px; color:var(--slate); font-weight:700; border-bottom:2px solid var(--navy)}
  table.cmp td.nm{text-align:left; font-weight:700; color:var(--navy); font-size:15px}
  table.cmp td.nm small{font-weight:500; color:#9aa6b0; font-size:11px; margin-left:6px}
  table.cmp tr+tr td{border-top:1px solid var(--line)}
  .cell{display:inline-block; min-width:62px; padding:6px 0; border-radius:7px; font-weight:800}
  .lgnd{margin-top:16px; font-size:12px; color:#9aa6b0; text-align:right}
  .spark{display:inline-flex; align-items:flex-end; gap:3px; height:30px}
  .spark .sb{width:8px; background:linear-gradient(180deg,var(--accent-soft),var(--accent)); border-radius:2px; min-height:3px}
  table.cmp td.spk{width:64px}
  .api-box{background:#fff; border:1px solid var(--line-d); border-radius:10px; padding:14px 15px; margin-bottom:6px}
  .api-box .row{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end}
  .api-box button{padding:9px 16px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap}
  .api-box button:hover{filter:brightness(1.07)}
  #apiStatus{font-size:11.5px; color:#6a7682; margin-top:9px; line-height:1.5}

  /* features */
  .feat-list{display:flex; flex-direction:column; gap:0}
  .feat-row{display:grid; grid-template-columns:140px 1fr; gap:20px; padding:14px 4px; border-bottom:1px solid var(--line); align-items:center}
  .feat-row:last-child{border-bottom:none}
  .feat-row .fn{font-weight:800; font-size:18px; color:var(--navy)} .feat-row .fn small{display:block;font-weight:600;font-size:11px;color:var(--accent);margin-top:3px}
  .feat-row .fd{font-size:14.5px; color:#4f5d68; line-height:1.55}
  .feat-row .fd.empty{color:#b6ab92; font-style:italic}
  /* overview card stats */
  .ov-card .ov-stat{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--navy);font-weight:600;line-height:1.5}
  .ov-card .ov-stat b{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
  /* 5-year A-grade trend */
  .t5-tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:4px}
  .t5-tbl th,.t5-tbl td{padding:6px 6px;text-align:center;font-size:13.5px}
  .t5-tbl th{font-size:11.5px;letter-spacing:1.2px;color:var(--slate);font-weight:700;border-bottom:2px solid var(--navy)}
  .t5-tbl td.nm{text-align:left;font-weight:700;color:var(--navy);font-size:14.5px;padding-left:6px}
  .t5-tbl td.nm small{display:block;font-size:10.5px;font-weight:500;color:#9aa6b0;margin-top:2px}
  .t5-tbl tr+tr td{border-top:1px solid var(--line)}
  .t5-tbl tr.top td{background:linear-gradient(90deg,#FFF4E2 0%,rgba(255,244,226,0) 70%)}
  .t5-cell{display:inline-block;min-width:46px;padding:5px 0;border-radius:6px;font-weight:800;font-size:13.5px}
  .t5-cell.lo{background:#EFE9DC;color:#9aa6b0}
  .t5-cell.md{background:#FFF3CC;color:var(--navy)}
  .t5-cell.hi{background:#FFD9B3;color:var(--navy)}
  .t5-cell.xhi{background:var(--accent);color:#fff}
  .t5-cell.cur{box-shadow:0 0 0 2px rgba(232,134,30,.55);transform:scale(1.04)}
  .t5-spark{display:inline-flex;align-items:flex-end;gap:3px;height:30px}
  .t5-spark .b{width:7px;border-radius:2px;background:linear-gradient(180deg,#D8C9AC,#A89977);min-height:3px}
  .t5-spark .b.cur{background:linear-gradient(180deg,var(--accent-soft),var(--accent))}
  .t5-trend{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:11px;letter-spacing:.2px}
  .t5-trend.up{background:rgba(232,134,30,.16);color:#a44d00}
  .t5-trend.dn{background:rgba(15,39,66,.08);color:#3b5475}
  .t5-trend.fl{background:#EFE9DC;color:#8a7d63}
  .t5-rk{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--heat0);color:var(--slate);font-weight:800;font-size:12px;align-items:center;justify-content:center}
  .t5-rk.top{background:var(--accent);color:#fff}
  .t5-note{margin-top:8px;font-size:11.5px;color:#9aa6b0;text-align:right;line-height:1.5}
  .tg-legend{display:flex;align-items:center;gap:18px;margin:2px 0 12px;font-size:12px;color:var(--slate);font-weight:600}
  .tg-legend i.d{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-2px}
  .tg-legend i.d.s{background:linear-gradient(90deg,var(--accent),var(--accent-soft))}
  .tg-legend i.d.f{background:linear-gradient(90deg,var(--navy),var(--navy2))}
  .tg-legend .sp{margin-left:auto;color:var(--navy);font-weight:700}
  .tg-legend .sp b{color:var(--accent)}
  .tg-grid{display:flex; flex-direction:column; gap:3px}
  .tg-row{display:grid; grid-template-columns:28px 140px 1fr 1fr 86px; gap:14px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:10px; padding:5px 12px; box-shadow:0 4px 14px -12px rgba(11,26,42,.35)}
  .tg-row.top{border-color:var(--accent); background:linear-gradient(90deg,#fff 60%,#FFF4E2)}
  .tg-row .rk{width:26px;height:26px;border-radius:50%;background:var(--heat0);color:var(--slate);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .tg-row.top .rk{background:var(--accent);color:#fff}
  .tg-row .nm{font-weight:800; font-size:15.5px; color:var(--navy); line-height:1.15}
  .tg-row .nm small{display:block; font-weight:500; font-size:10.5px; color:#9aa6b0; margin-top:3px; letter-spacing:.2px}
  .tg-bar{display:grid; grid-template-columns:58px 1fr 26px; align-items:center; gap:8px}
  .tg-bar .lb{font-size:10.5px; letter-spacing:1.2px; font-weight:800; color:var(--slate)}
  .tg-bar .lb.s{color:var(--accent)}
  .tg-bar .tr{height:14px; background:var(--heat0); border-radius:4px; overflow:hidden}
  .tg-bar .fl{height:100%; border-radius:4px; min-width:2px}
  .tg-bar .fl.s{background:linear-gradient(90deg,var(--accent),var(--accent-soft))}
  .tg-bar .fl.f{background:linear-gradient(90deg,var(--navy),var(--navy2))}
  .tg-bar .vv{font-weight:800; font-size:13px; color:var(--navy); font-variant-numeric:tabular-nums; text-align:right}
  .tg-row .tot{text-align:right; padding-left:6px; border-left:1px solid var(--line)}
  .tg-row .tot b{display:block; font-weight:900; font-size:22px; color:var(--navy); font-variant-numeric:tabular-nums; line-height:1}
  .tg-row .tot small{display:block; font-size:10.5px; color:var(--accent); font-weight:800; margin-top:3px; letter-spacing:.3px}
  .tg-row.top .tot b{color:var(--accent)}

  /* strategy */
  .strat{display:grid; grid-template-columns:1fr 1fr; gap:16px 26px; margin-top:8px}
  .strat .st{display:grid; grid-template-columns:42px 1fr; gap:15px; align-items:start}
  .strat .si{width:42px;height:42px;border-radius:11px;background:var(--navy);color:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:0 0 auto}
  .strat .si.acc{background:var(--accent);color:#fff}
  .strat .sh{font-weight:800;font-size:17px;color:var(--navy);margin-bottom:5px}
  .strat .sp{font-size:13.5px;color:#4f5d68;line-height:1.55}

  .empty-note{color:#b6ab92; font-style:italic; text-align:center; padding-top:90px; font-size:16px}

  /* editor panel */
  .ed-back{position:fixed; inset:0; background:rgba(10,16,24,.45); z-index:40; display:none}
  .ed-back.on{display:block}
  .editor{position:fixed; top:0; right:0; width:min(880px,94vw); height:100vh; background:#FBF9F4; z-index:41; box-shadow:-12px 0 40px -16px rgba(0,0,0,.4); transform:translateX(100%); transition:transform .28s ease; overflow-y:auto}
  .editor.on{transform:translateX(0)}
  .ed-h{position:sticky; top:0; background:var(--navy); color:#fff; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; z-index:2; border-bottom:2px solid var(--accent)}
  .ed-h b{font-weight:800; font-size:15px}
  .ed-h .x{background:rgba(255,255,255,.14); border:none; color:#fff; width:30px; height:30px; border-radius:7px; cursor:pointer; font-size:17px}
  .ed-b{padding:20px 22px 70px}
  .ed-sect{font-weight:800; font-size:13px; color:var(--navy); margin:22px 0 12px; letter-spacing:.3px; display:flex; align-items:center; gap:8px}
  .ed-sect:first-child{margin-top:4px}
  .ed-sect i{width:18px;height:2px;background:var(--accent)}
  .fg{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .f label{display:block; font-size:10.5px; font-weight:700; color:var(--slate); margin-bottom:4px}
  .f{margin-bottom:11px}
  .f input,.f textarea{width:100%; font-family:var(--sans); font-size:12.5px; border:1px solid var(--line-d); border-radius:7px; padding:8px 9px; color:var(--ink)}
  .f textarea{resize:vertical; min-height:48px; line-height:1.5}
  .f input:focus,.f textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--glow)}
  .tbl-wrap{overflow-x:auto; border:1px solid var(--line-d); border-radius:9px; background:#fff}
  table.ed{border-collapse:collapse; font-size:11.5px; min-width:1000px}
  table.ed th{background:var(--navy); color:#fff; font-weight:700; font-size:10px; padding:8px 6px; position:sticky; top:0; white-space:nowrap}
  table.ed td{border-bottom:1px solid var(--line); padding:3px}
  table.ed input{width:100%; border:1px solid transparent; border-radius:5px; padding:6px 6px; font-size:11.5px; font-family:var(--sans); background:transparent}
  table.ed input:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 2px var(--glow)}
  table.ed input.num{text-align:right}
  table.ed td.del button{border:none;background:#F2E9DA;color:#9b8d6e;width:24px;height:24px;border-radius:5px;cursor:pointer;font-size:13px}
  .ed-add{margin-top:10px;width:100%;padding:9px;border:1px dashed var(--accent);background:var(--glow);color:var(--accent);border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
  .ed-note{font-size:11px;color:#9aa6b0;margin-top:8px;line-height:1.5}

  /* present */
  .present{position:fixed; inset:0; background:#0a0f17; z-index:60; display:none; align-items:center; justify-content:center}
  .present.on{display:flex}
  .present .pw{transform-origin:center center}
  .present .nav{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:16px; background:rgba(255,255,255,.08); backdrop-filter:blur(10px); padding:8px 15px; border-radius:30px; z-index:61}
  .present .nav button{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:15px}
  .present .nav button:hover{background:var(--accent)}
  .present .nav .ct{color:#cdd7df;font-size:13px;min-width:54px;text-align:center}
  .present .exit{position:fixed;top:20px;right:22px;background:rgba(255,255,255,.1);color:#fff;border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;z-index:61}
  .present .exit:hover{background:var(--accent)}
  .present .az{position:fixed;top:0;bottom:0;width:20%;z-index:60;cursor:pointer}
  .present .al{left:0}.present .ar{right:0}

  @media print{
    body{background:#fff}
    .bar,.editor,.ed-back,.present{display:none!important}
    .stage{padding:0;gap:0}
    .slide-frame{max-width:none;width:1280px;box-shadow:none;border-radius:0;page-break-after:always;break-after:page}
    .slide-scaler{transform:none!important}
    @page{size:1280px 720px;margin:0}
  }
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#c9c0a9;border-radius:9px}
</style>
</head>
<body>
<div class="bar">

function markLogo(h){ return `<img src="${ICON}" alt="logo" style="height:${h}px;width:auto;display:block">`; }
function coverLogo(h){ return `<img src="${FULL}" alt="logo" style="height:${h}px;width:auto;display:block">`; }
/* 학교알리미 API 인증키는 소스에 넣지 않는다. 편집 패널에 입력한 키는 이 브라우저(localStorage)에만 저장된다. */
const API_KEY_LS='sdl.schoolinfo.apiKey';
try{ if(!DATA.config.apiKey) DATA.config.apiKey=localStorage.getItem(API_KEY_LS)||''; }catch(e){}
function rememberApiKey(v){ try{ v?localStorage.setItem(API_KEY_LS,v):localStorage.removeItem(API_KEY_LS); }catch(e){} }
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pc=v=>(v? (Math.round(v*1000)/10).toFixed(1) : '–');

/* ---- strategy content per brand ---- */
function strategy(){
  if(BRAND.brand==='brainiac') return [
    ['특목고·영재학교 대비','과학고·외고·국제고 진학을 목표로 한 영어 심화와 사고력 훈련.'],
    ['영어 1등급 기반','성취도 영어 보통학력 90%+ 학군 특성상, 등급을 가르는 어법·독해·서술형 정밀 대비.'],
    ['학교별 맞춤 내신','오륜·잠실·잠신중 등 학교별 시험 경향에 맞춘 밀착 내신 관리.'],
    ['고등 연계 로드맵','중등에서 고등 1등급으로 이어지는 어휘·구문·독해의 장기 학습 설계.']
  ];
  return [
    ['영어 내신·수능 통합','동작구 학교별 내신 출제 경향과 수능 영어를 한 흐름으로 잇는 옳은영어 커리큘럼.'],
    ['학교별 맞춤 대비','숭의여고·성남고 등 학교별 시험 특징과 범위에 맞춘 밀착 내신 관리.'],
    ['1등급 변별 훈련','등급을 가르는 어법·빈칸추론·서술형 중심의 고난도 변별 문항 집중.'],
    ['예비고1 출발 설계','중등에서 고등으로 넘어가는 시기, 어휘·구문·독해의 옳은 기초 정립.']
  ];
}

/* ---- slide builders ---- */
function frame(inner,tagText,n,total){
  return `<div class="slide">
    <div class="s-mark"><span class="lg">${markLogo(26)}</span>${BRAND.markText?`<b>${esc(DATA.config.academy)}<small>${esc(DATA.config.acaEn)}</small></b>`:''}</div>
    <div class="s-tag">${tagText}</div>
    <div class="s-body">${inner}</div>
    <div class="s-rule"></div><div class="s-num">${String(n).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>
  </div>`;
}
function sCover(){
  const c=DATA.config;
  if(BRAND.coverTheme==='light'){
    return `<div class="slide lightc"><div class="lglow"></div>
      <div class="cover-wrap">
        <span class="lc-logo">${coverLogo(168)}</span>
        <div class="cover-eyebrow" style="margin-top:28px"><i></i><span style="color:var(--accent)">${esc(c.acaEn)} · ${esc(c.region)}</span></div>
        <div class="cover-title" style="color:var(--navy)">${esc(c.title)}</div>
        <div class="cover-sub" style="color:var(--accent)">${esc(c.subtitle)} · 주요 ${DATA.schools.length}개교 분석</div>
      </div>
      <div class="cover-date" style="color:var(--slate)">${esc(c.date)}<br><span style="font-size:11px;opacity:.8">Think Different. Dream Beyond.</span></div>
    </div>`;
  }
  return `<div class="slide dark"><div class="beam"></div><div class="beam2"></div>
    <div class="cover-wrap">
      <div class="cover-eyebrow"><i></i><span>${esc(c.acaEn)} · ${esc(c.region)}</span></div>
      <div class="cover-title">${esc(c.title)}</div>
      <div class="cover-sub">${esc(c.subtitle)} · 주요 ${DATA.schools.length}개교 분석</div>
    </div>
    <div class="cover-brand"><span class="lg">${markLogo(42)}</span>${BRAND.markText?`<div class="cb-t">${esc(c.academy)}<small>${esc(c.acaEn)}</small></div>`:''}</div>
    <div class="cover-date">${esc(c.date)}<br><span style="font-size:11px;opacity:.7">정확한 분석, 옳은 방향</span></div>
  </div>`;

function sOverview(n,t){

      <div class="rk">${i+1}</div>
      <div class="nm">${esc(s.name)}<small>${esc(s.type)} · ${esc(s.area)}</small></div>
      <div class="track"><div class="fill ${accent?'acc':''}" style="width:${Math.max(2,s[key]/max*100)}%"></div></div>
      <div class="val">${unitPct?pc(s[key])+'<span style="font-size:12px;color:#9aa6b0">%</span>':esc(s[key])+'<span style="font-size:12px;color:#9aa6b0">명</span>'}</div>

function sTrend5yr(n,t){
  const ys = DATA.config.years5 || [2021,2022,2023,2024,2025];
  const valid = DATA.schools.filter(s => Array.isArray(s.tr5) && s.tr5.length===5 && s.tr5.some(v=>v>0));
  if(!valid.length) return frame('<div class="eyebrow"><i></i><span>5-YEAR A-GRADE TREND</span></div><div class="s-head">5개년 A등급 추이 데이터가 없습니다</div>','5-YEAR TREND',n,t);
  const sorted = [...valid].sort((a,b)=>(b.tr5[4]||0)-(a.tr5[4]||0));
  const all = sorted.flatMap(s=>s.tr5).filter(v=>v>0);
  const lo = Math.min(...all), hi = Math.max(...all);
  const ccls = v => { if(!v) return 'lo'; const r=(v-lo)/((hi-lo)||1); return r>0.78?'xhi':r>0.5?'hi':r>0.25?'md':'lo'; };
  const rows = sorted.map((s,i)=>{
    const cells = s.tr5.map((v,k)=>`<td><span class="t5-cell ${ccls(v)} ${k===4?'cur':''}">${v?v.toFixed(1):'—'}</span></td>`).join('');
    const mx = Math.max(...s.tr5,0.0001);
    const spark = s.tr5.map((v,k)=>`<span class="b ${k===4?'cur':''}" style="height:${Math.max(8,(v/mx)*100)}%"></span>`).join('');
    const first = s.tr5[0]||0, last = s.tr5[4]||0, diff = last-first;
    const trend = diff>2 ? `<span class="t5-trend up">▲ ${diff.toFixed(1)}</span>` : diff<-2 ? `<span class="t5-trend dn">▼ ${Math.abs(diff).toFixed(1)}</span>` : `<span class="t5-trend fl">▬ ${diff.toFixed(1)}</span>`;
    const avg5 = (s.tr5.reduce((a,b)=>a+b,0)/s.tr5.length).toFixed(1);
    return `<tr class="${i===0?'top':''}">
      <td><span class="t5-rk ${i===0?'top':''}">${i+1}</span></td>
      <td class="nm">${esc(s.name)}<small>${esc(s.area||'')} · ${esc(s.gender||'')}</small></td>
      ${cells}
      <td><span class="t5-spark">${spark}</span></td>
      <td>${trend}</td>
      <td style="font-weight:800;color:var(--navy)">${avg5}</td>
    </tr>`;
  }).join('');
  const inner = `<div class="eyebrow"><i></i><span>5-YEAR A-GRADE TREND</span></div>
    <div class="s-head" style="margin-bottom:4px;font-size:32px">최근 <em>5개년</em> A등급 비율 추이</div>
    <div class="s-sub" style="margin-bottom:8px">국·영·수 환산 (수학 1.5배 가중) · 2025년이 최고치이면 상승세 지속</div>
    <table class="t5-tbl"><thead><tr>
      <th style="width:34px"></th><th style="text-align:left;padding-left:6px">학교</th>
      ${ys.map((y,k)=>`<th${k===4?' style="color:var(--accent)"':''}>${y}</th>`).join('')}
      <th style="width:88px">5년추이</th><th style="width:78px">변화</th><th style="width:60px">평균</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <div class="t5-note">단위: A등급 비율(%) · 수학 1.5배 가중 · 출처: 학업성취도 평가 / 학군정보(apt2.me)</div>`;
  return frame(inner,'5-YEAR TREND',n,t);
}

function sTrend(n,t){
  const ys=DATA.config.years||[0,0,0];

function buildSlides(){
  const a=[];
  a.push(sCover);
  a.push((n,t)=>sOverview(n,t));
  a.push((n,t)=>barSlide('avg','학업성취도 <em>종합 순위</em>','OVERALL ACHIEVEMENT','ACHIEVEMENT',true,n,t,true,
      arr=>`<b>${esc(arr[0].name)}</b>이(가) 평균 <b>${pc(arr[0].avg)}%</b>로 학군 내 최상위. 상위권 학교일수록 수학에서 격차가 벌어집니다.`));
  a.push((n,t)=>barSlide('eng','영어 <em>보통학력이상</em> 비율','ENGLISH FOCUS','ENGLISH',true,n,t,true,
      arr=>`영어는 학군 전반이 <b>높은 성취</b>를 보입니다. 그만큼 <b>1·2등급은 소수 변별 문항</b>에서 갈립니다.`));
  if(DATA.config.showTrend!==false) a.push((n,t)=>sTrend(n,t));
  a.push((n,t)=>sTrend5yr(n,t));
  a.push((n,t)=>sSubjects(n,t));
  if(DATA.config.level==='middle')
    a.push((n,t)=>barSlide('u4r','특목고 <em>진학률</em>','SPECIAL-PURPOSE HS','특목고 진학',true,n,t,true,
      arr=>`<b>${esc(arr[0].name)}</b> 가 특목고 진학률 <b>${pc(arr[0].u4r)}%</b>로 최상위. 과학고·외고·국제고 합격이 학군 경쟁력의 지표입니다.`));
  else
    a.push((n,t)=>barSlide('u4','일반대학 진학 <em>인원</em>','COLLEGE OUTCOMES','PROGRESSION',false,n,t,false,
      arr=>`진학 ‘인원’과 ‘비율’은 학교 규모·계열 구성에 따라 다릅니다. 비율은 표를 함께 참고하세요.`));
  a.push((n,t)=>sFeatures(n,t));
  a.push(sClose);
  const T=a.length;
  return a.map((fn,i)=>fn(i+1,T));
}

    <div class="ed-note">수치 출처: 학교알리미(학생수·진학)·학군정보(apt2.me)·국가수준 학업성취도(asil.kr). 입력 즉시 슬라이드에 반영됩니다.</div>`;
  document.querySelectorAll('[data-c]').forEach(el=>el.addEventListener('input',e=>{DATA.config[e.target.dataset.c]=e.target.value;if(e.target.dataset.c==='apiKey')rememberApiKey(e.target.value.trim());renderDeck();}));
  document.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('input',e=>{
    const i=+e.target.dataset.i,k=e.target.dataset.k; let v=e.target.value;
    if(/^e[0-2]$/.test(k)){ const idx=+k[1]; DATA.schools[i].tr=DATA.schools[i].tr||{eng:[0,0,0]};
      DATA.schools[i].tr.eng[idx]= v===''?0:(+v/100); if(idx===2) DATA.schools[i].eng=DATA.schools[i].tr.eng[2]; renderDeck(); return; }
    if(/^y[0-4]$/.test(k)){ const idx=+k[1]; if(!Array.isArray(DATA.schools[i].tr5)) DATA.schools[i].tr5=[0,0,0,0,0];
      DATA.schools[i].tr5[idx]= v===''?0:(+v||0); renderDeck(); return; }
    if(['avg','kor','eng','math','u4r'].includes(k)){ v=v===''?0:(+v/100); if(k==='eng'){DATA.schools[i].tr=DATA.schools[i].tr||{eng:[0,0,0]};DATA.schools[i].tr.eng[2]=v;} }
    else if(['ex','grad','u4','sci','fl','snu'].includes(k)) v=v===''?0:(+v||0);
    DATA.schools[i][k]=v; renderDeck();
  }));
}
async function fetchAll(){
  const c=DATA.config, key=(c.apiKey||'').trim(), proxy=(c.proxy||'').trim();
  const st=document.getElementById('apiStatus');
  if(!key){ st.textContent='API 인증키를 먼저 입력하세요.'; return; }
  const coded=DATA.schools.filter(s=>(s.code||'').trim());
  if(!coded.length){ st.textContent='표준학교코드가 입력된 학교가 없습니다. 각 학교의 코드를 입력하세요.'; return; }
  st.textContent='학교알리미 호출 중… (최근 3개년)';
  let ok=0, fail=0;
  for(const s of coded){
    for(let i=0;i<c.years.length;i++){
      const yr=c.years[i];
      // 학교알리미 OpenAPI: apiType은 공시항목별 코드(개발가이드 참조). schulKndCode 04=고등학교
      const api=`https://www.schoolinfo.go.kr/openApi.do?apiKey=${encodeURIComponent(key)}&apiType=0&pbanYr=${yr}&schulKndCode=04&schulCode=${encodeURIComponent(s.code.trim())}`;
      const url=proxy?proxy+encodeURIComponent(api):api;
      try{
        const r=await fetch(url); const tx=await r.text();
        const doc=new DOMParser().parseFromString(tx,'text/xml');
        const num=tag=>{const el=doc.querySelector(tag);return el?parseFloat(el.textContent.replace(/[^0-9.]/g,'')):null;};
        /* === 필드 매핑: 선택한 apiType의 응답 태그명에 맞게 조정하세요 ===
           예) 학생수 항목 → s.ex = num('전체학생수');
               졸업생 진로 → s.u4 = num('진학자수'); s.u4r = num('진학률')/100;  */
        ok++;
      }catch(e){ fail++; }
    }
  }
  buildEditor(); renderDeck();
  st.innerHTML = (fail && !ok)
    ? '브라우저에서 직접 호출이 차단되었습니다(CORS). ‘프록시 URL’에 본인 서버/프록시를 지정한 뒤 다시 시도하세요. (예: 간단한 Node/PHP 프록시)'
    : `요청 완료 — 성공 ${ok} / 실패 ${fail}. 응답 필드 매핑은 학교알리미 개발가이드의 apiType에 맞게 fetchAll() 안에서 지정하세요.`;
}
window.fetchAll=fetchAll;
window.addSchool=()=>{DATA.schools.push({name:'',type:'일반고',area:'',gender:'공학',ex:0,avg:0,kor:0,eng:0,math:0,u4:0,u4r:0,snu:null,feat:''});buildEditor();renderDeck();};
window.rmSchool=i=>{DATA.schools.splice(i,1);buildEditor();renderDeck();};

/* ---- present ---- */
let idx=0; const present={on:false};
function startPresent(){present.on=true;idx=0;document.getElementById('present').classList.add('on');document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});showP();}
function exitPresent(){present.on=false;document.getElementById('present').classList.remove('on');document.fullscreenElement&&document.exitFullscreen().catch(()=>{});}
function showP(){document.getElementById('pw').innerHTML=slides[idx];document.getElementById('pct').textContent=`${idx+1} / ${slides.length}`;layoutP();}
function layoutP(){const k=Math.min(innerWidth/1280,innerHeight/720);document.getElementById('pw').style.transform=`scale(${k})`;}
window.go=d=>{idx=Math.max(0,Math.min(slides.length-1,idx+d));showP();};
window.startPresent=startPresent;window.exitPresent=exitPresent;window.openEditor=openEditor;window.closeEditor=closeEditor;
document.addEventListener('keydown',e=>{if(!present.on)return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1);}if(e.key==='Escape')exitPresent();});

/* ---- init ---- */
document.getElementById('barLogo').innerHTML=markLogo(34);
document.getElementById('barWm').innerHTML=BRAND.markText
  ? `${esc(DATA.config.academy)}<small>${esc(DATA.config.acaEn)} · ${esc(DATA.config.region)}</small>`
  : `<small style="font-size:11px;letter-spacing:2px;color:var(--accent-soft)">${esc(DATA.config.region)}</small>`;
renderDeck();

/* ---- auto-load from 학교알리미 / NEIS ---- */
(async function autoLoad(){
  try{
    const level = DATA.config.level==='middle' ? '중학교' : '고등학교';
    const names = DATA.schools.map(s=>{
      let n = s.name||''; if(!n) return '';
      // 정규화: '여고'->'여자고등학교', '중'->'중학교', '고'->'고등학교'
      n = n.replace(/여고$/,'여자고등학교').replace(/여중$/,'여자중학교');
      if(level==='고등학교' && !/고등학교$/.test(n)) n = n.replace(/고$/,'') + '고등학교';
      if(level==='중학교'   && !/중학교$/.test(n))   n = n.replace(/중$/,'') + '중학교';
      // 중대부고 -> 중앙대학교사범대학부속고등학교 (대표 케이스)
      if(/^중대부고등학교$|^중대부속고등학교$|^중대부고$/.test(s.name)) n='중앙대학교사범대학부속고등학교';
      return n;
    });
    const bar = document.createElement('div');
    bar.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0B1A2A;color:#E4C277;padding:9px 18px;border-radius:30px;font-size:12.5px;font-weight:700;z-index:50;box-shadow:0 8px 24px -10px rgba(0,0,0,.5);letter-spacing:.3px';
    bar.textContent='NEIS에서 학교 기본정보 불러오는 중…';
    document.body.appendChild(bar);
    const r = await fetch('/api/school-bundle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schools:names,level})});
    const j = await r.json();
    const ys = (j.schools[0]&&j.schools[0].years)||DATA.config.years;
    DATA.config.years = ys;
    let filled=0;
    j.schools.forEach((res,i)=>{
      if(!res||!res.found) return;
      const s = DATA.schools[i]; if(!s) return;
      s.code = res.schoolCode;
      if(res.address && !s.area) s.area = res.address.split(' ').slice(2,4).join(' ');
      if(res.students && !s.ex) s.ex = res.students;
      if(res.entrants) s.entrants = res.entrants;
      if(res.coedu && !s.gender) s.gender = res.coedu.replace('남여공학','공학').replace(/학교$/,'');
      if(typeof res.kor==='number') s.kor = res.kor;
      if(typeof res.eng==='number') s.eng = res.eng;
      if(typeof res.math==='number') s.math = res.math;
      if(typeof res.avg==='number') s.avg = res.avg;
      if(res.tr){ s.tr = s.tr||{}; if(res.tr.eng) s.tr.eng = res.tr.eng;
        if(res.tr.avg) s.tr.avg = res.tr.avg; if(res.tr.u4r) s.tr.u4r = res.tr.u4r; }
      if(typeof res.u4==='number') s.u4 = res.u4;
      if(typeof res.u4r==='number') s.u4r = res.u4r;
      if(res.grad) s.grad = res.grad;
      filled++;
    });
    renderDeck();
    bar.style.background='#0B1A2A'; bar.style.color='#E4C277';
    bar.textContent = `NEIS 기본정보 갱신 완료 · ${filled}/${j.schools.length}개교 (학업성취도·진학 수치는 수동 입력값)`;
    setTimeout(()=>{ bar.style.transition='opacity .6s'; bar.style.opacity='0'; setTimeout(()=>bar.remove(),700); }, 3500);
  }catch(e){
    console.error('autoLoad failed', e);
  }
})();

/* ===== PPTX 저장 ===== */
function _loadScript(src){
  return new Promise((res,rej)=>{
    if([...document.scripts].some(s=>s.src===src)) return res();
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load fail '+src));
    document.head.appendChild(s);
  });
}
async function exportPPTX(){
  const btn=document.getElementById('btnPptx');
  const orig=btn?btn.innerHTML:'';
  try{
    if(btn){ btn.disabled=true; btn.innerHTML='준비 중…'; }
    await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await _loadScript('https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js');
    const slides=document.querySelectorAll('#deck .slide');
    if(!slides.length){ alert('슬라이드가 없습니다.'); return; }
    const pptx=new PptxGenJS();
    pptx.layout='LAYOUT_WIDE';
    const W=13.333, H=7.5;
    let i=0;
    for(const el of slides){
      i++;
      if(btn) btn.innerHTML=`렌더링 ${i}/${slides.length}…`;
      const canvas=await html2canvas(el,{scale:2,backgroundColor:null,useCORS:true,logging:false,width:1280,height:720,windowWidth:1280,windowHeight:720});
      const img=canvas.toDataURL('image/png');
      const s=pptx.addSlide();
      s.addImage({data:img,x:0,y:0,w:W,h:H});
    }
    if(btn) btn.innerHTML='파일 저장 중…';
    const title=(document.title||'presentation').replace(/[\\/:*?"<>|]/g,'_');
    await pptx.writeFile({fileName:title+'.pptx'});
  }catch(e){
    console.error(e); alert('PPTX 저장 실패: '+e.message);
  }finally{
    if(btn){ btn.disabled=false; btn.innerHTML=orig; }
  }
}

</script>


<script>
/* ===== Inline slide text edit (generic, persistent) ===== */
(function(){
  const KEY='slideOv_v2_'+location.pathname;
  let OV={}; try{ OV=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch{}
  let on=false;
  const INLINE=new Set(['B','I','EM','STRONG','U','SUB','SUP','SMALL','MARK','BR','SPAN']);
  const SKIP_CLOSEST='svg,canvas,script,style,button,input,textarea,select,.editor,.nav,.acts,.api-box';
  function isTextLeaf(el){
    if(!el.textContent || !el.textContent.trim()) return false;
    if(el.closest(SKIP_CLOSEST)) return false;
    for(const c of el.children){ if(!INLINE.has(c.tagName)) return false; }
    return true;
  }
  function pathKey(el, root){
    const p=[]; let n=el;
    while(n && n!==root){
      const par=n.parentElement; if(!par) break;
      p.unshift([...par.children].indexOf(n));
      n=par;
    }
    return p.join('/');
  }
  function walk(){
    document.querySelectorAll('#deck .slide').forEach((sl,si)=>{
      sl.querySelectorAll('*').forEach(el=>{
        if(!isTextLeaf(el)) return;
        const k=si+'#'+pathKey(el,sl);
        el.dataset.edk=k;
        if(OV[k]!=null && el.innerHTML!==OV[k]) el.innerHTML=OV[k];
        if(on){ el.setAttribute('contenteditable','true'); el.classList.add('ed-tgt'); }
        else  { el.removeAttribute('contenteditable'); el.classList.remove('ed-tgt'); }
      });
    });
  }
  const orig=window.renderDeck;
  if(orig) window.renderDeck=function(){ const r=orig.apply(this,arguments); walk(); return r; };
  let saveT=null;
  function toast(msg){
    let t=document.getElementById('edToast');
    if(!t){ t=document.createElement('div'); t.id='edToast';
      t.style.cssText='position:fixed;right:18px;bottom:18px;background:#0c1830;color:#E4C277;border:1px solid rgba(228,194,119,.4);padding:8px 14px;border-radius:8px;font-size:13px;z-index:99999;opacity:0;transition:opacity .2s';
      document.body.appendChild(t); }
    t.textContent=msg; t.style.opacity='1';
    clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity='0',1200);
  }
  document.addEventListener('input', e=>{
    const t=e.target.closest && e.target.closest('[data-edk]'); if(!t) return;
    OV[t.dataset.edk]=t.innerHTML;
    clearTimeout(saveT);
    saveT=setTimeout(()=>{
      try{ localStorage.setItem(KEY, JSON.stringify(OV)); toast('저장됨'); }catch{ toast('저장 실패'); }
    },300);
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.getAttribute && e.target.getAttribute('contenteditable')==='true' && !e.shiftKey){
      e.preventDefault(); e.target.blur();
    }
  });
  function toggle(){
    on=!on; walk();
    const b=document.getElementById('btnSlideEd');
    if(b){ b.classList.toggle('primary',on); b.lastChild.textContent= on?' 편집 끝내기':' 슬라이드 편집'; }
    toast(on?'편집 모드 · 텍스트를 클릭해 수정':'편집 종료 · 변경사항 저장됨');
  }
  function reset(){
    if(!confirm('이 페이지의 슬라이드 텍스트 수정을 모두 초기화할까요?')) return;
    OV={}; try{localStorage.removeItem(KEY);}catch{}
    if(window.renderDeck) renderDeck(); else location.reload();
  }
  function inject(){
    const dataBtn=[...document.querySelectorAll('button')].find(b=>/데이터\s*편집/.test(b.textContent));
    if(!dataBtn) return;
    const b1=document.createElement('button');
    b1.id='btnSlideEd'; b1.className='btn';
    b1.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;vertical-align:-2px"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><span> 슬라이드 편집</span>';
    b1.onclick=toggle;
    const b2=document.createElement('button');
    b2.className='btn'; b2.innerHTML='<span>편집 초기화</span>'; b2.onclick=reset;
    dataBtn.after(b1); b1.after(b2);
  }
  const style=document.createElement('style');
  style.textContent='.ed-tgt{outline:1.5px dashed rgba(228,194,119,.55);outline-offset:3px;cursor:text;border-radius:2px}.ed-tgt:hover{background:rgba(228,194,119,.08)}.ed-tgt:focus{outline:2px solid #E4C277;background:rgba(228,194,119,.14)}';
  document.head.appendChild(style);
  function init(){ inject(); walk(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

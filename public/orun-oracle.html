<html lang="ko">

<title>ORUN ORACLE · 출제자 성향 프로파일러</title>
<meta name="description" content="학교 기출문제와 시험범위 원문을 쌓아 선생님별 출제 성향을 학습하고, 다음 시험을 예측해 적중 동형 모의고사를 만드는 도구">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js" integrity="sha384-rNlaE5fs9dGIjmxWDALQh/RBAaGRYT5ChrzHo6tRfgrZ36iRFAiquP5g41Jsv+0j" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" integrity="sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2" crossorigin="anonymous"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js" integrity="sha384-9EQoUIJYrv09/oYhSxnw1VpLcfPw3BM9dE7+D/3wGUPeLLa7F9Z6OAoD+i/M6FK9" crossorigin="anonymous"></script>
<style>
:root {
  --void: #03060e; --void2: #070d1c; --ink: #dfeaf4; --dim: #8fa8bf; --faint: #5b7288;
  --holo: #37c6ff; --holo2: #7fe0ff; --gold: #f5c518; --bad: #ff6b7a; --ok: #3ef2c8;
  --line: rgba(150,200,255,.13); --line-hot: rgba(150,200,255,.38); --glass: rgba(8,18,34,.58); --glass2: rgba(10,22,42,.82);
  --f: 'Noto Sans KR', 'Noto Sans', system-ui, -apple-system, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --r: 12px; --panelL: 304px; --panelR: 356px; --top: 54px; --dock: 74px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink); font-family: var(--f); font-size: 14px; line-height: 1.5; overflow: hidden; }
body { -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: rgba(20,40,70,.45); color: var(--ink); border-radius: 8px; padding: 6px 12px; transition: background .15s, border-color .15s, transform .1s; }
button:hover { background: rgba(40,80,130,.55); border-color: var(--line-hot); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .38; cursor: not-allowed; transform: none; }
button.pri { background: linear-gradient(135deg, rgba(55,198,255,.35), rgba(55,198,255,.12)); border-color: rgba(55,198,255,.55); box-shadow: 0 0 18px rgba(55,198,255,.18) inset; }
button.pri:hover { background: linear-gradient(135deg, rgba(55,198,255,.5), rgba(55,198,255,.2)); }
button.ghost { background: transparent; }
button.link { background: transparent; border: 0; color: var(--holo2); padding: 2px 4px; text-decoration: underline dotted; }
button.danger { border-color: rgba(255,107,122,.5); color: #ffb3bb; }
input[type=text], input[type=password], input[type=number], select, textarea { background: rgba(4,10,22,.7); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; color: var(--ink); width: 100%; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--holo); box-shadow: 0 0 0 2px rgba(55,198,255,.18); }
textarea { resize: vertical; min-height: 80px; }
a { color: var(--holo2); }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: rgba(120,170,220,.25); border-radius: 8px; }
[hidden] { display: none !important; }
.small { font-size: 12px; color: var(--dim); } .faint { color: var(--faint); } .mono { font-family: var(--mono); font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .grow { flex: 1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; }
.kv b { font-weight: 500; color: var(--dim); font-size: 12px; letter-spacing: .04em; }
.gold { color: var(--gold); } .ok { color: var(--ok); } .bad { color: var(--bad); }

/* ── 무대 ── */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: none; }
#bgVideo { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: -10px; top: -10px; }
body.nogl #fx { display: none; }
#flat { position: fixed; inset: var(--top) 0 var(--dock) 0; overflow: auto; padding: 24px; display: none; z-index: 1;
  background: radial-gradient(1200px 600px at 50% 110%, rgba(27,111,168,.25), transparent 60%), var(--void); }
body.nogl #flat, body.flat #flat { display: block; }
body.flat #fx { display: none; }

/* ── 유리 패널 ── */
.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(130%); -webkit-backdrop-filter: blur(14px) saturate(130%); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.02) inset; }
.ph { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 11px; letter-spacing: .22em; color: var(--dim); text-transform: uppercase; }
.ph::before { content: ""; width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 8px var(--gold); flex: none; }
.ph .grow { flex: 1; } .ph button { padding: 2px 8px; font-size: 11px; letter-spacing: 0; }
.pb { padding: 12px 14px; overflow: auto; }
.sec { margin: 0 0 14px; } .sec h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .18em; color: var(--dim); font-weight: 500; text-transform: uppercase; }
.sec h4 span { float: right; letter-spacing: 0; text-transform: none; color: var(--faint); }

/* ── 상단 ── */
#topbar { position: fixed; left: 0; right: 0; top: 0; height: var(--top); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: linear-gradient(180deg, rgba(3,6,14,.92), rgba(3,6,14,.55) 70%, transparent); pointer-events: none; }
#topbar > * { pointer-events: auto; }
#brand { display: flex; align-items: baseline; gap: 10px; }
#brand b { font-weight: 700; letter-spacing: .28em; font-size: 15px; color: #fff; text-shadow: 0 0 18px rgba(55,198,255,.55); }
#brand span { font-size: 11px; color: var(--dim); letter-spacing: .08em; }
#engine { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; }
#engine i { width: 8px; height: 8px; border-radius: 50%; background: #555; box-shadow: 0 0 8px transparent; transition: all .3s; }
#engine.ok i { background: var(--ok); box-shadow: 0 0 10px var(--ok); } #engine.fail i { background: var(--bad); box-shadow: 0 0 10px var(--bad); } #engine.busy i { background: var(--holo); box-shadow: 0 0 10px var(--holo); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .35; } }
#wave { width: 180px; height: 34px; opacity: .85; }
#topRight { margin-left: auto; display: flex; gap: 8px; align-items: center; }
#fpsTag { font-family: var(--mono); font-size: 11px; color: var(--faint); }

/* ── 좌·우 패널 ── */
#panelL, #panelR { position: fixed; top: calc(var(--top) + 6px); bottom: calc(var(--dock) + 10px); z-index: 10; display: flex; flex-direction: column; transition: transform .3s ease, opacity .3s; }
#panelL { left: 14px; width: var(--panelL); } #panelR { right: 14px; width: var(--panelR); }
#panelL .pb, #panelR .pb { flex: 1; }
body.hideL #panelL { transform: translateX(-120%); opacity: 0; pointer-events: none; } body.hideR #panelR { transform: translateX(120%); opacity: 0; pointer-events: none; }
.tog { position: fixed; z-index: 11; top: 50%; width: 22px; height: 56px; border-radius: 6px; padding: 0; font-size: 12px; color: var(--dim); }
#togL { left: 4px; transform: translateY(-50%); } #togR { right: 4px; transform: translateY(-50%); }

/* 패널 안 요소 */
.stat { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 13px; }
.stat b { font-weight: 500; color: var(--dim); font-size: 12px; } .stat i { font-style: normal; font-family: var(--mono); font-size: 12px; text-align: right; }
.bar { height: 6px; background: rgba(120,170,220,.12); border-radius: 4px; overflow: hidden; margin: 3px 0 8px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--holo), var(--holo2)); border-radius: 4px; box-shadow: 0 0 10px rgba(55,198,255,.6); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.bar.gold > i { background: linear-gradient(90deg, #c99a00, var(--gold)); box-shadow: 0 0 10px rgba(245,197,24,.5); }
.dist { display: grid; grid-template-columns: 5.2em 1fr 3em; gap: 4px 8px; align-items: center; font-size: 12px; }
.dist .bar { margin: 0; } .dist i.n { text-align: right; font-style: normal; font-family: var(--mono); color: var(--dim); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11px; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--line-hot); background: rgba(55,198,255,.08); color: var(--holo2); white-space: nowrap; }
.chip.gold { border-color: rgba(245,197,24,.5); color: var(--gold); background: rgba(245,197,24,.08); }
.chip.dim { border-color: var(--line); color: var(--dim); background: transparent; }
.tl { display: flex; flex-direction: column; gap: 4px; }
.tl .it { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: rgba(6,14,28,.5); cursor: pointer; font-size: 12px; transition: border-color .15s; }
.tl .it:hover { border-color: var(--line-hot); } .tl .it .t { color: var(--ink); } .tl .it .s { color: var(--faint); font-size: 11px; grid-column: 1 / -1; }
.badge { font-size: 10px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); align-self: start; white-space: nowrap; }
.badge.ok { border-color: rgba(62,242,200,.45); color: var(--ok); } .badge.warn { border-color: rgba(245,197,24,.5); color: var(--gold); } .badge.bad { border-color: rgba(255,107,122,.5); color: var(--bad); }
.q { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; font-size: 12px; background: rgba(6,14,28,.5); }
.q .n { color: var(--ink); } .q .d { grid-column: 1 / -1; color: var(--dim); font-size: 11px; }
.q .prog { grid-column: 1 / -1; } .q .x { padding: 0 6px; font-size: 11px; }
.q.err { border-color: rgba(255,107,122,.45); }
.tlist { display: flex; flex-direction: column; gap: 4px; }
.tlist .it { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.tlist .it:hover { border-color: var(--line-hot); background: rgba(55,198,255,.05); }
.tlist .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
.empty { padding: 20px 10px; text-align: center; color: var(--faint); font-size: 12px; line-height: 1.7; }
.empty b { display: block; color: var(--dim); font-weight: 500; margin-bottom: 4px; }
.check { list-style: none; padding: 0; margin: 6px 0 0; font-size: 12px; color: var(--dim); } .check li::before { content: "☐ "; color: var(--faint); } .check li.on::before { content: "☑ "; color: var(--ok); } .check li.on { color: var(--ink); }
.narr { font-size: 13px; line-height: 1.75; color: var(--ink); }
.note { font-size: 11px; color: var(--faint); line-height: 1.6; border-left: 2px solid var(--line-hot); padding-left: 8px; margin: 6px 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; } .tbl th, .tbl td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; } .tbl th { color: var(--dim); font-weight: 500; font-size: 11px; letter-spacing: .06em; }
.tbl tr.rowbtn { cursor: pointer; } .tbl tr.rowbtn:hover td { background: rgba(55,198,255,.06); }
details.raw summary { cursor: pointer; color: var(--dim); font-size: 12px; } details.raw pre { white-space: pre-wrap; font-size: 11px; color: var(--dim); max-height: 300px; overflow: auto; background: rgba(4,10,22,.6); padding: 8px; border-radius: 6px; }
.hot { display: grid; grid-template-columns: 3.4em 1fr; gap: 3px 8px; font-size: 12px; align-items: center; margin-bottom: 4px; cursor: pointer; }
.hot .p { font-family: var(--mono); color: var(--gold); text-align: right; } .hot .t { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hot .w { grid-column: 1 / -1; } .hot:hover .t { color: var(--holo2); }
.why { font-size: 11px; color: var(--faint); grid-column: 1 / -1; padding-left: 4px; }

/* ── 독 ── */
#dock { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 15; display: flex; align-items: center; gap: 6px; padding: 8px 10px; max-width: calc(100vw - 28px); }
#dock .sep { width: 1px; height: 26px; background: var(--line); margin: 0 4px; }
#dock button { white-space: nowrap; }
#dock button b { font-weight: 600; }
#queueMini { font-size: 12px; color: var(--dim); display: flex; gap: 8px; align-items: center; padding-left: 4px; }
.menu { position: fixed; z-index: 30; min-width: 200px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.menu button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; }
.menu button:hover { background: rgba(55,198,255,.12); }

/* ── 3D 위에 붙는 칩 ── */
#chips { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
.hchip { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); padding: 5px 11px; font-size: 12px; white-space: nowrap; border-radius: 20px; background: var(--glass2); border: 1px solid var(--line-hot); color: var(--ink); backdrop-filter: blur(8px); will-change: transform; box-shadow: 0 6px 20px rgba(0,0,0,.4); transition: opacity .2s; }
.hchip.busy { border-color: var(--holo); color: var(--holo2); box-shadow: 0 0 18px rgba(55,198,255,.35); }
.hchip.drop { border-color: var(--gold); color: var(--gold); background: rgba(40,32,4,.85); }
.hchip.err { border-color: var(--bad); color: #ffb3bb; }
.hchip .bar { width: 120px; margin: 4px 0 0; height: 4px; }
#dropAll { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .2s; background: radial-gradient(ellipse at center, rgba(55,198,255,.10), transparent 60%); border: 2px dashed rgba(55,198,255,.35); }
body.dragging #dropAll { opacity: 1; }

/* ── 드로어 ── */
#drawer { position: fixed; top: calc(var(--top) + 6px); bottom: calc(var(--dock) + 10px); right: 14px; width: 460px; max-width: calc(100vw - 28px); z-index: 25; display: flex; flex-direction: column; transform: translateX(110%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
#drawer.on { transform: none; }
#drawer .pb { flex: 1; }

/* ── 시트(모달) ── */
#sheetWrap { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(2,5,12,.62); backdrop-filter: blur(4px); padding: 16px; }
#sheetWrap.on { display: flex; }
#sheet { width: 560px; max-width: 100%; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
#sheet .pb { max-height: calc(100vh - 110px); }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--dim); padding: 6px 10px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--holo); }
.field { margin-bottom: 12px; } .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; } .seg button { padding: 5px 10px; font-size: 12px; } .seg button.on { border-color: var(--holo); color: var(--holo2); background: rgba(55,198,255,.12); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; } .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: 0 0 10px currentColor; } .sw.on { border-color: #fff; transform: scale(1.12); }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.drop { border: 1px dashed var(--line-hot); border-radius: 10px; padding: 18px; text-align: center; color: var(--dim); font-size: 12px; cursor: pointer; background: rgba(55,198,255,.04); }
.drop.over { border-color: var(--gold); background: rgba(245,197,24,.06); }
.err { color: #ffb3bb; font-size: 12px; margin-top: 6px; }
.help kbd { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--line-hot); border-radius: 4px; background: rgba(55,198,255,.08); margin-right: 8px; }

/* ── 토스트 ── */
#toasts { position: fixed; left: 50%; bottom: calc(var(--dock) + 24px); transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; padding: 8px 14px; border-radius: 20px; font-size: 13px; background: var(--glass2); border: 1px solid var(--line-hot); box-shadow: 0 8px 30px rgba(0,0,0,.45); animation: toastIn .25s cubic-bezier(.2,.8,.2,1); display: flex; gap: 10px; align-items: center; max-width: 80vw; }
.toast.bad { border-color: rgba(255,107,122,.6); } .toast.ok { border-color: rgba(62,242,200,.5); } .toast button { padding: 2px 10px; font-size: 12px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* ── 온보딩 ── */
#onboard { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8; display: flex; gap: 12px; padding: 14px; pointer-events: none; }
#onboard .st { pointer-events: auto; width: 210px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(6,14,28,.5); transition: border-color .3s, opacity .3s; }
#onboard .st.on { border-color: var(--holo); box-shadow: 0 0 20px rgba(55,198,255,.18); } #onboard .st.done { opacity: .65; border-color: rgba(62,242,200,.45); }
#onboard .st b { display: block; font-size: 13px; margin-bottom: 4px; } #onboard .st b::before { content: attr(data-n); display: inline-block; width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 50%; border: 1px solid var(--line-hot); font-size: 11px; margin-right: 8px; color: var(--holo2); }
#onboard .st.done b::before { content: "✓"; border-color: var(--ok); color: var(--ok); }
#onboard .st p { margin: 0 0 8px; font-size: 12px; color: var(--dim); line-height: 1.5; }

/* ── 2D 폴백 카드 ── */
#flatGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; max-width: 1100px; margin: 0 auto; }
.tcard { position: relative; padding: 18px 16px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; overflow: hidden; transition: border-color .2s, transform .2s; --c: var(--holo); }
.tcard:hover, .tcard.on { border-color: var(--c); transform: translateY(-2px); } .tcard.over { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.tcard .ring { width: 74px; height: 74px; margin: 0 auto 10px; border-radius: 50%; position: relative; background: radial-gradient(circle, var(--c) 0%, transparent 62%); box-shadow: 0 0 40px color-mix(in srgb, var(--c) 45%, transparent); }
.tcard .ring::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: conic-gradient(from 0deg, var(--c) 0 40deg, transparent 40deg 60deg, var(--c) 60deg 130deg, transparent 130deg 150deg, var(--c) 150deg 250deg, transparent 250deg 270deg, var(--c) 270deg 360deg); -webkit-mask: radial-gradient(circle, transparent 62%, #000 64%, #000 72%, transparent 74%); mask: radial-gradient(circle, transparent 62%, #000 64%, #000 72%, transparent 74%); animation: spin 14s linear infinite; }
.tcard.busy .ring::before { animation-duration: 2s; }
@keyframes spin { to { transform: rotate(360deg); } }
.tcard h3 { margin: 0; font-size: 15px; text-align: center; } .tcard p { margin: 2px 0 8px; text-align: center; font-size: 12px; color: var(--dim); }

<script>
(function () {
  "use strict";
  const BUILD = "build: 2026-09-12 17:15";
  // ==================================================================
  //  DB — IndexedDB. 파일 원본은 두지 않고 추출한 텍스트와 데이터만 둔다.
  //  stores: teachers · exams · questions · passages · profiles · events · settings · media
  // ==================================================================
  const DB = (function () {
    const NAME = "orun_oracle", VERSION = 1;
    const STORES = {
      teachers:  { key: "id", idx: [] },
      exams:     { key: "id", idx: ["teacherId"] },
      questions: { key: "id", idx: ["teacherId", "examId"] },
      passages:  { key: "id", idx: ["teacherId", "sourceId"] },
      sources:   { key: "id", idx: ["teacherId"] },          // 시험범위 원문 파일 단위
      profiles:  { key: "id", idx: ["teacherId"] },          // 버전별 스냅샷
      events:    { key: "id", idx: ["teacherId"] },          // 학습 이력
      predictions: { key: "id", idx: ["teacherId"] },
      mocks:     { key: "id", idx: ["teacherId"] },          // 만든 적중 모의고사
      settings:  { key: "key", idx: [] },
      media:     { key: "key", idx: [] },                    // 배경 영상 blob
    };
    let dbp = null;
    function open() {
      if (dbp) return dbp;
      dbp = new Promise((res, rej) => {
        if (!("indexedDB" in window)) { rej(new Error("이 브라우저는 저장소(IndexedDB)를 지원하지 않아요.")); return; }
        const req = indexedDB.open(NAME, VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          Object.keys(STORES).forEach(name => {
            const s = STORES[name];
            const st = db.objectStoreNames.contains(name) ? req.transaction.objectStore(name) : db.createObjectStore(name, { keyPath: s.key });
            s.idx.forEach(ix => { if (!st.indexNames.contains(ix)) st.createIndex(ix, ix, { unique: false }); });
          });
        };
        req.onsuccess = () => { const db = req.result; db.onversionchange = () => { try { db.close(); } catch (e) {} dbp = null; }; res(db); };
        req.onerror = () => rej(req.error || new Error("저장소를 열지 못했어요."));
        req.onblocked = () => rej(new Error("다른 탭이 저장소를 붙잡고 있어요. 다른 탭을 닫고 새로 고쳐 주세요."));
      });
      dbp.catch(() => { dbp = null; });
      return dbp;
    }
    function tx(store, mode, fn) {
      return open().then(db => new Promise((res, rej) => {
        const t = db.transaction(store, mode);
        const st = t.objectStore(store);
        let out;
        try { out = fn(st, t); } catch (e) { rej(e); return; }
        t.oncomplete = () => res(out && out.__req ? out.__req.result : out);
        t.onerror = () => rej(t.error || new Error("저장소 작업이 실패했어요."));
        t.onabort = () => rej(t.error || new Error("저장소 작업이 중단됐어요."));
      }));
    }
    const wrap = (req) => ({ __req: req });
    const api = {
      get: (store, key) => tx(store, "readonly", st => wrap(st.get(key))),
      put: (store, value) => tx(store, "readwrite", st => { st.put(value); return value; }),
      putAll: (store, values) => tx(store, "readwrite", st => { values.forEach(v => st.put(v)); return values.length; }),
      del: (store, key) => tx(store, "readwrite", st => { st.delete(key); return true; }),
      delWhere: (store, idx, value) => tx(store, "readwrite", st => {
        const r = st.index(idx).openKeyCursor(IDBKeyRange.only(value));
        let n = 0;
        r.onsuccess = () => { const c = r.result; if (c) { st.delete(c.primaryKey); n++; c.continue(); } };
        return { __req: { get result() { return n; } } };
      }),
      all: (store) => tx(store, "readonly", st => wrap(st.getAll())),
      where: (store, idx, value) => tx(store, "readonly", st => wrap(st.index(idx).getAll(IDBKeyRange.only(value)))),
      count: (store, idx, value) => tx(store, "readonly", st => wrap(idx ? st.index(idx).count(IDBKeyRange.only(value)) : st.count())),
      clear: (store) => tx(store, "readwrite", st => { st.clear(); return true; }),
      setting: async (key, fallback) => { const r = await api.get("settings", key); return r ? r.value : fallback; },
      setSetting: (key, value) => api.put("settings", { key, value }),
      wipe: async () => { for (const s of Object.keys(STORES)) await api.clear(s); },
      STORES: Object.keys(STORES),
    };
    return api;
  })();
  // 짧고 충돌 없는 id — 시각 + 난수
  function uid(prefix) {
    const t = Date.now().toString(36), r = Math.random().toString(36).slice(2, 8);
    return (prefix || "x") + "_" + t + r;
  }

  // ==================================================================
  //  EXTRACT — 파일 → 텍스트. PDF(pdf.js) · DOCX · HWP 5.0 · HWPX · XLSX · TXT.
  //  글자가 없는 PDF(스캔본)는 쪽을 그림으로 만들어 모델이 옮겨 적는다(OCR).
  //  동형 모의고사 생성기의 추출기를 그대로 옮겨 왔다.
  // ==================================================================
  const EXTRACT = (function () {
    const PDF_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    function pdfWorkerReady() {
      try { return !!(globalThis.pdfjsWorker && globalThis.pdfjsWorker.WorkerMessageHandler); } catch (e) { return false; }
    }
    function withTimeout(promise, ms, msg) {
      let timer;
      const guard = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(msg)), ms); });
      return Promise.race([promise, guard]).finally(() => clearTimeout(timer));
    }
    function readAsBuffer(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error(file.name + " 파일을 읽지 못했습니다."));
        r.readAsArrayBuffer(file);
      });
    }
    function extOf(name) { const m = /\.([a-z0-9]+)$/i.exec(name || ""); return m ? m[1].toLowerCase() : ""; }
    function decodeEntities(s) {
      return s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, d) => String.fromCharCode(+d)).replace(/&amp;/g, "&");
    }
    function xmlToText(xml, paraCloseTags) {
      let s = xml;
      paraCloseTags.forEach(t => { s = s.split(t).join("\n"); });
      s = s.replace(/<[^>]+>/g, "");
      return decodeEntities(s);
    }
    function tidy(s) { return String(s || "").replace(/ /g, " ").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim(); }

    async function openPdf(buf) {
      if (typeof pdfjsLib === "undefined") throw new Error("PDF 처리 라이브러리를 불러오지 못했습니다. 페이지를 새로 고친 뒤 다시 시도해 주세요.");
      if (!pdfWorkerReady()) pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
      try {
        return await withTimeout(pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise, 90000,
          "PDF를 여는 데 시간이 너무 오래 걸립니다. 페이지를 새로 고친 뒤 다시 올려주세요.");
      } catch (e) {
        const raw = (e && e.message) || "";
        if (/fake worker|Cannot load script|Worker was destroyed/i.test(raw)) throw new Error("PDF 처리 모듈을 불러오지 못했습니다. 페이지를 새로 고친 뒤 다시 올려주세요.");
        if (/password/i.test(raw)) throw new Error("암호가 걸린 PDF입니다. 암호를 푼 파일로 올려주세요.");
        if (/Invalid PDF|structure/i.test(raw)) throw new Error("PDF 파일이 손상되었거나 형식이 올바르지 않습니다.");
        throw e;
      }
    }
    async function pdfText(buf) {
      const doc = await openPdf(buf);
      let out = "";
      for (let p = 1; p <= doc.numPages; p++) {
        const page = await doc.getPage(p);
        const tc = await page.getTextContent();
        const lines = [];
        let line = "", lastY = null, lastEnd = null;
        for (const it of tc.items) {
          if (typeof it.str !== "string") continue;
          const y = Math.round(it.transform[5]), x = it.transform[4];
          if (lastY !== null && Math.abs(y - lastY) > 3) { lines.push(line); line = ""; lastEnd = null; }
          if (line && lastEnd !== null && x - lastEnd > 1.5 && !line.endsWith(" ") && !it.str.startsWith(" ")) line += " ";
          line += it.str;
          lastY = y; lastEnd = x + (it.width || 0);
          if (it.hasEOL) { lines.push(line); line = ""; lastEnd = null; }
        }
        if (line) lines.push(line);
        out += "[p." + p + "]\n" + lines.join("\n") + "\n\n";
      }
      const pages = doc.numPages;
      if (doc.cleanup) try { doc.cleanup(); } catch (e) {}
      return { text: tidy(out), pages };
    }
    // 글자가 거의 없거나 깨진 PDF — 스캔본이거나 글꼴 정보가 빠진 파일
    function looksUnreadable(text) {
      const t = String(text || "").replace(/\[p\.\d+\]/g, "");
      const solid = t.replace(/\s/g, "");
      if (solid.length < 200) return true;
      const letters = (t.match(/[A-Za-z가-힣]/g) || []).length;
      if (letters / solid.length < 0.45) return true;
      if ((t.match(/�/g) || []).length > solid.length / 200) return true;
      return false;
    }
    async function docx(buf) {
      if (typeof JSZip === "undefined") throw new Error("문서 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
      const zip = await JSZip.loadAsync(buf);
      const doc = zip.file("word/document.xml");
      if (!doc) throw new Error("Word 문서 형식이 올바르지 않습니다.");
      let xml = await doc.async("string");
      xml = xml.replace(/<w:tab[^>]*\/>/g, "\t").replace(/<w:br[^>]*\/>/g, "\n");
      return tidy(xmlToText(xml, ["</w:p>"]));
    }
    async function hwpx(buf) {
      if (typeof JSZip === "undefined") throw new Error("문서 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
      const zip = await JSZip.loadAsync(buf);
      const names = Object.keys(zip.files).filter(n => /^Contents\/section\d+\.xml$/i.test(n))
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      if (!names.length) throw new Error("HWPX 문서 형식이 올바르지 않습니다.");
      let out = "";
      for (const n of names) out += xmlToText(await zip.file(n).async("string"), ["</hp:p>", "</p>"]) + "\n";
      return tidy(out);
    }
    function sheet(buf) {
      if (typeof XLSX === "undefined") throw new Error("엑셀 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
      const wb = XLSX.read(new Uint8Array(buf), { type: "array", codepage: 949 });
      let out = "";
      wb.SheetNames.forEach(name => { const csv = XLSX.utils.sheet_to_csv(wb.Sheets[name]); if (csv.trim()) out += "[시트: " + name + "]\n" + csv + "\n\n"; });
      return tidy(out);
    }
    function hwp(buf) {
      if (typeof XLSX === "undefined" || typeof pako === "undefined") throw new Error("HWP 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
      let cfb;
      try { cfb = XLSX.CFB.read(new Uint8Array(buf), { type: "buffer" }); }
      catch (_) { throw new Error("HWP 5.0 형식이 아닙니다. (구버전 HWP는 한글에서 '다른 이름으로 저장'으로 변환해 주세요)"); }
      const header = XLSX.CFB.find(cfb, "FileHeader");
      if (!header) throw new Error("HWP 파일 헤더를 찾지 못했습니다.");
      const hb = new Uint8Array(header.content);
      const flags = hb[36] | (hb[37] << 8) | (hb[38] << 16) | (hb[39] << 24);
      const compressed = (flags & 1) === 1;
      if ((flags & 2) === 2) throw new Error("암호가 걸린 HWP 파일은 지원하지 않습니다. 암호를 해제 후 올려주세요.");
      const sections = (cfb.FullPaths || []).map((p, i) => ({ p, i })).filter(e => /BodyText\/Section\d+$/i.test(e.p))
        .sort((a, b) => a.p.localeCompare(b.p, undefined, { numeric: true }));
      if (!sections.length) throw new Error("HWP 본문 섹션을 찾지 못했습니다.");
      let out = "";

    // ---- 범위 원문 → 지문 ----
    function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

      const fw = String(first || "").split(/\s+/).filter(Boolean), lw = String(last || "").split(/\s+/).filter(Boolean);

    // indexScope(text, { name, onStep, signal }) → passages[] (id 는 호출자가 붙인다)
    async function indexScope(text, o) {
      o = o || {};

      const out = [];
      for (let i = 0; i < chunks.length; i++) {
        if (o.signal && o.signal.aborted) throw API.err("cancelled", "중단됨");
        if (o.onStep) o.onStep({ phase: "index", i: i + 1, n: chunks.length });
        const list = await API.json(PROMPTS.index(o.name || "자료", chunks[i], i + 1, chunks.length), { light: true, array: true, tier: "default", effort: "low", signal: o.signal,
          validate: v => Array.isArray(v) ? "" : "배열이 아닙니다" });
        for (const e of list) {
          if (!e || !e.first) continue;
          const kind = ["지문", "어휘", "문법", "기타"].includes(e.kind) ? e.kind : "기타";
          const full = kind === "지문" ? locate(chunks[i], e.first, e.last) : null;

            words: kind === "지문" ? TEXT.words(txt).length : (+e.words || 0), feats: arr(e.feats).map(x => str(x, 12)).slice(0, 6), text: txt, located: !!full, sentences,

            grammarTargets: arr(e.grammar_targets).map(g => ({ point: str(g && g.point, 12), sent: +(g && g.sent) || 0 })).filter(g => g.point).slice(0, 5),
            orderFriendly: !!e.order_friendly, insertFriendly: !!e.insert_friendly, difficultyEst: DIFFS.includes(e.difficulty_est) ? e.difficulty_est : "중" });

    }
    function lessonFrom(src) { const m = /L(?:esson)?\s*(\d+)|(\d+)\s*과|Unit\s*(\d+)/i.exec(src || ""); return m ? "L" + (m[1] || m[2] || m[3]) : ""; }

    // ---- 문항 ↔ 지문 매칭 (로컬 셔글 → 미확정만 LLM) ----
    function passageIndex(passages) {

    function scoreLocal(q, idx) {

    // ---- AI 활용 추정 ----

    async function aiJudge(exam, questions, loc, answerKeyText, priorText, signal) {

    function combineAI(loc, llm, nq) {
      const ai = llm ? (loc.coverage >= 0.5 ? 0.6 * loc.local + 0.4 * llm.llmScore : 0.4 * loc.local + 0.6 * llm.llmScore) : loc.local;

        blurMat.uniforms.dir.value.set(1 / A[i].width, 0);

      streakMat.uniforms.texel.value.set(1 / sA.width, 1 / sA.height);
      streakMat.uniforms.uStep.value = 1.0;
      streakMat.uniforms.gate.value = streakGate.value;

      streakMat.uniforms.gate.value = 0.0;
      streakMat.uniforms.tSrc.value = sA.texture;
      streakMat.uniforms.uStep.value = 4.0;

      streakMat.uniforms.tSrc.value = sB.texture;

      /* 그레인 시계는 벽시계여야 한다. 프레임당 1/60 을 더하면 15fps 짜리 기계에서

      streakGate: streakGate,
      // grade

      caAmount: compMat.uniforms.caAmount,
      grainAmount: compMat.uniforms.grainAmount,
      grainShadow: compMat.uniforms.grainShadow,
      grainChroma: compMat.uniforms.grainChroma,
      vignetteAmount: compMat.uniforms.vignetteAmount,
      vignetteRadius: compMat.uniforms.vignetteRadius,
      vignetteSoft: compMat.uniforms.vignetteSoft,
      saturation: compMat.uniforms.saturation,

      render: render,
      setSize: setSize,
      dispose: dispose,

      /* 구형 안드로이드 WebGL1 등에서는 HDR 타깃을 못 잡아 UnsignedByte 로 떨어지고

  }

  //  STAGE — three.js 무대. 힉스 필드(입자 바닥) 위에 선생님 홀로그램이 선다.
  //  앱의 어떤 기능도 여기에 기대지 않는다 — WebGL 이 없으면 null 을 돌려주고 앱은 2D 로 간다.

          streakIntensity: 0.22, streakGate: 1.6, streakDecay: 0.09, streakTint: 0x8fd6ff, streakDesat: 0.2,

    const rnd = (a, b) => a + Math.random() * (b - a);

    // ---- 힉스 필드: 바닥 입자장 ----
    const EXN = 8;
    const fieldUni = {
      uTime: { value: 0 }, uPx: { value: (lowEnd ? 2.2 : 2.8) * DPR },
      uEx: { value: Array.from({ length: EXN }, () => new THREE.Vector4(0, 0, 0, 1)) },
      uWave: { value: new THREE.Vector4(0, 0, 0, 0) },
      uCol: { value: new THREE.Color(0x1b6fa8) }, uHot: { value: new THREE.Color(0x6fd4ff) },
    };
    const field = (function () {
      const NX = lowEnd ? 150 : 230, NZ = lowEnd ? 90 : 140, SX = 46, SZ = 28;
      const pos = new Float32Array(NX * NZ * 3), seed = new Float32Array(NX * NZ);
      let i = 0, j = 0;
      for (let z = 0; z < NZ; z++) for (let x = 0; x < NX; x++) {
        pos[i++] = -SX / 2 + (x / (NX - 1)) * SX + rnd(-0.05, 0.05);
        pos[i++] = 0;
        pos[i++] = -SZ / 2 + (z / (NZ - 1)) * SZ + rnd(-0.05, 0.05);
        seed[j++] = Math.random();
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      g.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));
      const m = new THREE.ShaderMaterial({
        uniforms: fieldUni, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        vertexShader: `
          uniform float uTime; uniform float uPx; uniform vec4 uEx[${EXN}]; uniform vec4 uWave;
          attribute float aSeed; varying float vB; varying float vHot;
          void main(){
            vec3 p = position;
            float h = sin(p.x*0.35 + uTime*0.55)*cos(p.z*0.31 - uTime*0.42)*0.10;
            h += sin(length(p.xz)*0.8 - uTime*0.9)*0.045;
            float hot = 0.0;
            for (int i = 0; i < ${EXN}; i++) {
              float s = uEx[i].z;
              float d = distance(p.xz, uEx[i].xy);
              float g = exp(-d*d/(uEx[i].w*uEx[i].w)) * s;
              h += g * (0.22 + 0.16*sin(d*3.2 - uTime*4.5));
              hot += g;
            }
            float dw = distance(p.xz, uWave.xy);
            float ring = exp(-pow((dw - uWave.z)*2.4, 2.0)) * uWave.w;
            h += ring*0.35; hot += ring*0.7;
            p.y += h;
            vB = clamp(0.22 + h*1.4 + aSeed*0.12, 0.0, 1.0);
            vHot = clamp(hot, 0.0, 1.0);
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = uPx * (1.0 + 0.8*vHot) * clamp(16.0 / -mv.z, 0.25, 3.0);

        fragmentShader: `
          uniform vec3 uCol; uniform vec3 uHot; varying float vB; varying float vHot;
          void main(){

    })();
    // 필드 흥분점 슬롯 — 선생님마다 하나씩 (최대 8)

    // ---- 공용 셰이더 ----
    const RING_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;

      uniform vec3 uColor; uniform float uTime; uniform float uSegs; uniform float uGap; uniform float uOff; uniform float uGlow; uniform float uAlpha;

    const CORE_FS = `
      uniform vec3 uColor; uniform float uTime; uniform float uPulse; uniform float uBusy; uniform float uEnergy;
      varying vec3 vN; varying vec3 vV; varying vec3 vP;
      float h3(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }

        float veins = smoothstep(0.55, 0.85, n);

    const COL_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
    const COL_FS = `
      uniform vec3 uColor; uniform float uTime; uniform float uOn; varying vec2 vUv;
      void main(){
        float v = vUv.y;

    const PT_VS = `
      uniform float uTime; uniform float uT0; uniform float uDur; uniform vec3 uFrom; uniform vec3 uTo; uniform float uPx; uniform float uMode;

      uniform vec3 uColor; varying float vA;
      void main(){ vec2 c = gl_PointCoord - 0.5; float r = dot(c,c); if (r > 0.25) discard;
        float a = smoothstep(0.25, 0.03, r) * vA; gl_FragColor = vec4(uColor * a * 2.2, a);
        ${TAIL}

    // ---- 충격파 바닥 평면 (학습 완료) ----
    const WAVE_FS = `
      uniform vec3 uColor; uniform float uP; varying vec2 vUv;
      void main(){
        vec2 q = vUv*2.0 - 1.0; float r = length(q), ang = atan(q.y, q.x);

    const waveGeo = new THREE.PlaneGeometry(2, 2);

    // ---- 배경 영상 (힉스필드 등으로 만든 영상을 무대 뒤에 깐다) ----
    let backdrop = null;
    function setBackdrop(video, dim) {

      if (!post) tex.encoding = THREE.sRGBEncoding;

    // ---- 조명 (받침대는 표준 재질) ----
    scene.add(new THREE.HemisphereLight(0x7fbfff, 0x02040a, 0.35));
    const key = new THREE.DirectionalLight(0x9fd0ff, 0.5); key.position.set(4, 8, 6); scene.add(key);

    // ---- 이름표 스프라이트 ----
    function makeLabel(text, sub, colorHex) {
      const cv = document.createElement("canvas"); cv.width = 512; cv.height = 160;
      const ctx = cv.getContext("2d");

      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.shadowColor = colorHex; ctx.shadowBlur = 18;
      ctx.fillStyle = "#eaf6ff"; ctx.font = "600 44px 'Noto Sans KR', 'Noto Sans', sans-serif";
      ctx.fillText(text, 256, 56);
      ctx.shadowBlur = 0; ctx.fillStyle = colorHex; ctx.font = "500 24px 'Noto Sans KR', 'Noto Sans', sans-serif";
      ctx.fillText(sub || "", 256, 112);
      const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
      if (!post) tex.encoding = THREE.sRGBEncoding;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false, toneMapped: false });
      const sp = new THREE.Sprite(mat); sp.scale.set(3.2, 1.0, 1); sp.renderOrder = 10;
      return sp;
    }

    // ---- 선생님 홀로그램 ----
    const teachers = new Map();  // id → rig
    const order = [];            // 배치 순서
    const pedGeo = new THREE.CylinderGeometry(0.95, 1.1, 0.22, 48);
    const pedMat = new THREE.MeshStandardMaterial({ color: 0x0b1626, metalness: 0.7, roughness: 0.35, emissive: 0x06111f });

    function layout() {

        rig.slot = i;
      });
    }

    function addTeacher(t) {
      if (teachers.has(t.id)) { updateTeacher(t); return; }
      const color = new THREE.Color(t.color || "#4fd8ff");
      const hex = "#" + color.getHexString();
      const group = new THREE.Group();
      const uni = { uColor: { value: color }, uTime: { value: 0 }, uPulse: { value: 0 }, uBusy: { value: 0 }, uGlow: { value: 0 }, uOn: { value: 0 }, uEnergy: { value: 0 } };
      const ped = new THREE.Mesh(pedGeo, pedMat); ped.position.y = 0.11; group.add(ped);
      const pedRing = new THREE.Mesh(new THREE.RingGeometry(0.98, 1.08, 64), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide, toneMapped: false }));
      pedRing.rotation.x = -Math.PI / 2; pedRing.position.y = 0.225; group.add(pedRing);
      const col = new THREE.Mesh(colGeo, new THREE.ShaderMaterial({ uniforms: { uColor: uni.uColor, uTime: uni.uTime, uOn: uni.uOn }, vertexShader: COL_VS, fragmentShader: COL_FS,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
      col.position.y = 1.9; group.add(col);
      const core = new THREE.Mesh(coreGeo, new THREE.ShaderMaterial({ uniforms: { uColor: uni.uColor, uTime: uni.uTime, uPulse: uni.uPulse, uBusy: uni.uBusy, uEnergy: uni.uEnergy }, vertexShader: CORE_VS, fragmentShader: CORE_FS }));

      // 예측 막대 자리
      const bars = new THREE.Group(); bars.position.set(0, 0.22, 1.35); group.add(bars);
      // 이름표

      group.position.set(0, -6, 0);

      const rig = { id: t.id, group, uni, core, col, rings, scan, shards, shardData, halo, hg, constel, bars, label, hit, hex, color,
                    level: 0, busy: 0, hover: 0, sel: 0, phase: Math.random() * 6.28, slot: order.length, dirty: true, barTargets: [] };

    function updateTeacher(t) {

      rig.group.remove(rig.label); rig.label.material.map.dispose(); rig.label.material.dispose();
      rig.label = makeLabel(t.name || "선생님", t.sub || "", rig.hex); rig.label.scale.set(2.6, 0.81, 1); rig.label.position.y = 3.65; rig.group.add(rig.label);
    }

    // ---- 이펙트 ----
    const bursts = [];
    function spawnParticles(rig, mode, fromWorld) {

        dir[i * 3] = v.x; dir[i * 3 + 1] = v.y; dir[i * 3 + 2] = v.z; seed[i] = Math.random();
      }

    // 화면 좌표 → 카메라 앞 어느 깊이의 월드 점 (떨어뜨린 자리에서 입자가 날아가게)
    function screenToWorld(x, y, depth) {
      const v = new THREE.Vector3((x / W) * 2 - 1, -(y / H) * 2 + 1, 0.5).unproject(camera);
      const d = v.sub(camera.position).normalize();
      return camera.position.clone().add(d.multiplyScalar(depth || 9));
    }
    const fx = {
      ingest(id, sx, sy) {
        const rig = teachers.get(id); if (!rig) return;

        const ex = exSlot(rig.slot); tween(0.4, (e) => { ex.z = Math.max(ex.z, e * 0.9); });
      },
      thinking(id, on) {
        const rig = teachers.get(id); if (!rig) return;

        tween(0.8, (e) => { rig.busy = from + (to - from) * e; rig.uni.uBusy.value = rig.busy; rig.uni.uGlow.value = Math.max(rig.hover, rig.busy); }, ease.out, null, "busy:" + id);
        if (on) { rig.scan.material.opacity = 0.9; } else { tween(0.6, (e) => { rig.scan.material.opacity = 0.9 * (1 - e); }); }
        const ex = exSlot(rig.slot); const z0 = ex.z; tween(0.8, (e) => { ex.z = z0 + (to * 0.8 - z0) * e; ex.w = 3.0; }, ease.out, null, "ex:" + id);

      learned(id, o) {

        const w = fieldUni.uWave.value; w.x = rig.group.position.x; w.y = rig.group.position.z;

        if (o.profile) setProfile(id, o.profile);
      },
      predict(id, bars) {

        const g = rig.bars;
        while (g.children.length) { const c = g.children.pop(); if (c.material) { if (c.material.map) c.material.map.dispose(); c.material.dispose(); } if (c.geometry && c.geometry !== barGeo) c.geometry.dispose(); }

    // ---- 카메라 궤도 ----
    const cam = { theta: 0, phi: 1.22, dist: 15.5, target: new THREE.Vector3(0, 1.6, 0), auto: !calm, idle: 0,

    // ================= 시트들 =================
    function teacherForm(t) {
      const SCHOOLS = ["경문고", "동작고", "상도고", "성남고", "수도여고", "숭의여고", "중앙대사대부고"];

      const seg = (id) => { const s = el.querySelector(id); s.querySelectorAll("button").forEach(b => b.onclick = () => { s.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); }); };

    function openTeacherSheet(t, files) {
      const f = teacherForm(t); pendingFiles = files || null;
      const submit = async () => { const d = f.read(); const err = f.el.querySelector("#tfErr"); if (!d.name) { err.textContent = "이름을 넣어 주세요"; return; } if (!d.school) { err.textContent = "학교를 넣어 주세요"; return; }
        if (!t && [...S.teachers.values()].some(x => x.name === d.name && x.school === d.school) && !confirm("같은 학교에 같은 이름의 선생님이 있어요. 그래도 만들까요?")) return;
        const pf = pendingFiles; closeSheet();
        if (t) { await APP.updateTeacher(t.id, d); toast("저장했어요", { ok: true }); }
        else { const nt = await APP.createTeacher(d); toast(nt.name + " 선생님을 만들었어요", { ok: true }); if (pf && pf.length) APP.enqueue(pf, nt.id); } };
      f.el.querySelector("#tfOk").onclick = submit; f.el.querySelector("#tfCancel").onclick = closeSheet;
      f.el.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); submit(); } });
      openSheet(t ? "선생님 정보" : "새 선생님", f.el, { kind: "teacher" });
    }

      const target = busy ? 0.75 : 0.12; waveE += (target - waveE) * 0.05; waveT += APP.calm() ? 0.01 : 0.05;
      const W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = busy ? "#7fe0ff" : "rgba(127,224,255,.45)"; ctx.lineWidth = 2; ctx.beginPath();
      for (let x = 0; x <= W; x += 3) { const win = 0.5 - 0.5 * Math.cos(2 * Math.PI * x / W); const y = H / 2 + 14 * waveE * win * (Math.sin(x * 0.08 + waveT * 6) + 0.5 * Math.sin(x * 0.19 - waveT * 9) + 0.25 * Math.sin(x * 0.41 + waveT * 13)); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
      ctx.fillStyle = "rgba(143,168,191,.9)"; ctx.font = "600 11px sans-serif"; ctx.fillText(busy ? "THINKING…" : "LISTENING", 6, 14);

      const g = $("flatGrid");
      g.innerHTML = [...S.teachers.values()].map(t => { const c = S.counts.get(t.id) || {}, p = S.profiles.get(t.id), busy = S.busy.has(t.id) || S.queue.some(j => j.teacherId === t.id && !["done", "error", "cancelled", "queued"].includes(j.stage));
        return '<div class="tcard' + (S.selectedId === t.id ? " on" : "") + (busy ? " busy" : "") + '" data-id="' + t.id + '" style="--c:' + t.color + '"><div class="ring"></div><h3>' + esc(t.name) + '</h3><p>' + esc(APP.sub(t)) + '</p><div class="nums"><span><b>' + (c.exams || 0) + '</b>기출</span><span><b>' + (c.questions || 0) + '</b>문항</span><span><b>' + (c.passages || 0) + '</b>지문</span><span><b>' + (p ? "v" + p.version : "—") + '</b>학습</span></div><div class="bar" style="margin-top:8px"><i style="width:' + Math.min(100, (c.questions || 0) / 1.5) + '%"></i></div>' + (busy ? '<div class="small" style="text-align:center">' + esc(S.busy.get(t.id) || (S.queue.find(j => j.teacherId === t.id) || {}).detail || "") + '</div>' : "") + '</div>'; }).join("") + '<div class="tcard new" id="flatNew">＋ 새 선생님</div>';
      g.querySelectorAll(".tcard[data-id]").forEach(el => {
        el.onclick = () => APP.select(el.dataset.id);
        ["dragover", "dragenter"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); el.classList.add("over"); }));
        ["dragleave", "drop"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); el.classList.remove("over"); }));
        el.addEventListener("drop", e => { const files = [...e.dataTransfer.files]; if (files.length) APP.enqueue(files, el.dataset.id); });
      });
      $("flatNew").onclick = () => openTeacherSheet(null);
    }

    // ================= 드래그앤드롭(무대) =================
    function bindDrop() {
      let raf = 0, lastXY = null;
      document.addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); document.body.classList.add("dragging"); });
      document.addEventListener("dragover", e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; lastXY = [e.clientX, e.clientY]; if (!raf) raf = requestAnimationFrame(() => { raf = 0; const st = APP.stage(); const id = st && lastXY ? st.pick(lastXY[0], lastXY[1]) : null; if (id !== dropTarget) { if (st && dropTarget) st.fx.highlight(dropTarget, false); dropTarget = id; if (st && id) st.fx.highlight(id, true); } }); });
      document.addEventListener("dragleave", e => { if (e.relatedTarget === null || e.clientX <= 0 || e.clientY <= 0) { document.body.classList.remove("dragging"); clearDrop(); } });
      document.addEventListener("drop", e => {
        if (!hasFiles(e)) return; e.preventDefault(); document.body.classList.remove("dragging");
        if (e.target.closest && (e.target.closest("#sheetWrap") || e.target.closest(".tcard"))) { clearDrop(); return; }
        const files = [...e.dataTransfer.files]; const st = APP.stage(); const id = st ? st.pick(e.clientX, e.clientY) : null; const at = { x: e.clientX, y: e.clientY };
        clearDrop();
        if (!files.length) return;
        const vids = files.filter(f => /\.(mp4|webm)$/i.test(f.name)), docs = files.filter(f => !/\.(mp4|webm)$/i.test(f.name));
        if (vids.length) toast("배경 영상으로 쓸까요? " + vids[0].name, { action: "배경으로 쓰기", onAction: () => setVideo(vids[0]) });
        if (!docs.length) return;
        if (id) { APP.enqueue(docs, id, at); return; }
        if (!S.teachers.size) { openTeacherSheet(null, docs); return; }
        const t = sel();
        if (t) toast("선택한 " + t.name + " 선생님에게 넣을까요?", { action: "넣기", onAction: () => APP.enqueue(docs, t.id, at) });
        else openPickSheet(docs);
      });
      function clearDrop() { const st = APP.stage(); if (st && dropTarget) st.fx.highlight(dropTarget, false); dropTarget = null; }
      function hasFiles(e) { return e.dataTransfer && [...(e.dataTransfer.types || [])].includes("Files"); }
    }
    function openPickSheet(files) {
      const el = h('<div><div class="tlist">' + [...S.teachers.values()].map(t => '<div class="it" data-pick="' + t.id + '"><i class="dot" style="background:' + t.color + ';color:' + t.color + '"></i><span class="grow">' + esc(t.name) + '</span><span class="small">' + esc(APP.sub(t)) + '</span></div>').join("") + '</div><div class="actions"><button type="button" id="pickNew">새 선생님 만들기</button></div></div>');
      el.querySelectorAll("[data-pick]").forEach(x => x.onclick = () => { closeSheet(); APP.enqueue(files, x.dataset.pick); });
      el.querySelector("#pickNew").onclick = () => openTeacherSheet(null, files);
      openSheet("어느 선생님에게 넣을까요?", el, { kind: "pick" });
    }

    // ================= 공통 실행 래퍼 =================
    async function run(fn, label) {
      try { const r = await fn(); return r; }
      catch (e) { console.error(e); toast(API.friendly(e), { bad: true }); if (e.code === "no_key" || e.code === "bad_key") openSettings("engine"); return null; }
    }

    // ================= 초기화 =================
    function init() {
      $("btnNew").onclick = () => openTeacherSheet(null);
      $("btnFiles").onclick = () => { if (sel()) $("fileInput").click(); };
      $("fileInput").accept = EXTRACT.ACCEPT + ",.mp4,.webm";
      $("fileInput").onchange = () => { const t = sel(); const files = [...$("fileInput").files]; $("fileInput").value = ""; if (t && files.length) APP.enqueue(files, t.id); };
      $("importInput").onchange = async () => { const f = $("importInput").files[0]; $("importInput").value = ""; if (!f) return; try { const r = await APP.importJson(f); toast("불러왔어요 — 선생님 " + r.teachers + "명" + (r.dupSkipped ? ", 겹친 파일 " + r.dupSkipped + "개는 건너뛰었어요" : ""), { ok: true }); closeSheet(); } catch (e) { toast(e.message, { bad: true }); } };
      $("videoInput").onchange = () => { const f = $("videoInput").files[0]; $("videoInput").value = ""; if (f) setVideo(f); };
      $("btnLearn").onclick = () => { const t = sel(); if (t) run(() => APP.learn(t.id, { force: true })); };
      $("btnPredict").onclick = openPredictSheet;
      $("btnMock").onclick = openMockSheet;
      $("btnExport").onclick = (e) => {
        if (menu) { menu.remove(); menu = null; return; }
        const t = sel();
        menu = h('<div class="menu glass"><button type="button" data-a="all">전체 백업 (JSON)</button><button type="button" data-a="one"' + (t ? "" : " disabled") + '>이 선생님만 (JSON)</button><button type="button" data-a="bp"' + (t && S.predictions.get(t.id) ? "" : " disabled") + '>청사진 복사</button><button type="button" data-a="mocks"' + (t ? "" : " disabled") + '>지난 모의고사</button><button type="button" data-a="import">JSON 불러오기…</button></div>');
        const r = e.currentTarget.getBoundingClientRect(); menu.style.left = r.left + "px"; menu.style.bottom = (window.innerHeight - r.top + 8) + "px"; document.body.appendChild(menu);
        menu.querySelectorAll("button").forEach(b => b.onclick = () => { const a = b.dataset.a; menu.remove(); menu = null; if (a === "all") APP.exportJson(null).then(x => toast("전체 백업을 내려받았어요 (" + TEXT.fmtBytes(x.size) + ")", { ok: true })); else if (a === "one") APP.exportJson(t.id).then(x => toast(t.name + " 선생님 데이터를 내려받았어요", { ok: true })); else if (a === "bp") copyBlueprint(); else if (a === "mocks") openDrawer("mocks"); else if (a === "import") $("importInput").click(); });
        setTimeout(() => document.addEventListener("click", function off(ev) { if (menu && !menu.contains(ev.target)) { menu.remove(); menu = null; } document.removeEventListener("click", off); }), 0);
      };
      $("btnSettings").onclick = () => openSettings("engine"); $("engine").onclick = () => openSettings("engine"); $("btnHelp").onclick = openHelp;
      $("ob1Btn").onclick = () => openSettings("engine"); $("ob2Btn").onclick = () => openTeacherSheet(null);
      $("btnEditTeacher").onclick = () => { const t = sel(); if (t) openTeacherSheet(t); };
      $("btnEditTeacher").oncontextmenu = (e) => { e.preventDefault(); const t = sel(); if (t) openDeleteSheet(t); };
      $("sheetClose").onclick = closeSheet; $("sheetWrap").addEventListener("click", e => { if (e.target === $("sheetWrap")) closeSheet(); });
      $("drawerClose").onclick = closeDrawer; $("drawerBack").onclick = drawerBack;
      $("togL").onclick = () => { document.body.classList.toggle("hideL"); $("togL").textContent = document.body.classList.contains("hideL") ? "›" : "‹"; };
      $("togR").onclick = () => { document.body.classList.toggle("hideR"); $("togR").textContent = document.body.classList.contains("hideR") ? "‹" : "›"; };
      $("paperClose").onclick = () => $("paper").classList.remove("on"); $("paperPrint").onclick = () => window.print(); $("paperDocx").onclick = paperDocx;
      $("paperCopy").onclick = async () => { const txt = $("paperPage").innerText; try { await navigator.clipboard.writeText(txt); toast("본문을 복사했어요", { ok: true }); } catch (e) { toast("복사하지 못했어요", { bad: true }); } };
      document.addEventListener("keydown", (e) => {
        const tag = (e.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea" || tag === "select") { if (e.key === "Escape") closeSheet(); return; }
        if (e.key === "Escape") { if ($("paper").classList.contains("on")) $("paper").classList.remove("on"); else if ($("sheetWrap").classList.contains("on")) closeSheet(); else if ($("drawer").classList.contains("on")) closeDrawer(); else if (menu) { menu.remove(); menu = null; } return; }
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key.toLowerCase(); const t = sel();
        if (k === "n") openTeacherSheet(null); else if (k === "o" && t) $("fileInput").click(); else if (k === "l" && t) run(() => APP.learn(t.id, { force: true })); else if (k === "p" && t) openPredictSheet(); else if (k === "m" && t) openMockSheet();
        else if (k === "[") $("togL").click(); else if (k === "]") $("togR").click(); else if (k === "?") openHelp();
        else if (e.key === "ArrowLeft" || e.key === "ArrowRight") { const ids = [...S.teachers.keys()]; if (!ids.length) return; let i = ids.indexOf(S.selectedId); i = (i + (e.key === "ArrowRight" ? 1 : -1) + ids.length) % ids.length; APP.select(ids[i]); }
      });
      bindDrop();
      APP.on((why, data) => {
        if (why === "boot") { updateEngine(); renderPanelL(); renderPanelR(); renderDock(); renderFlat(); renderOnboard(); $("fpsTag").hidden = !S.ui.showFps; if (!API.ready() && !S.teachers.size) setTimeout(() => toast("먼저 설정에서 API 키를 저장해 주세요 — 동형 모의고사 생성기에 저장한 키가 있으면 그대로 써요", { action: "설정 열기", onAction: () => openSettings("engine") }), 800); }
        else if (why === "teachers" || why === "select" || why === "data") { renderPanelL(); renderPanelR(); renderDock(); renderFlat(); renderOnboard(); if (why === "select") closeDrawer(); }
        else if (why === "queue") { renderPanelL(); renderDock(); renderFlat(); renderOnboard(); }
        else if (why === "busy") { renderDock(); renderFlat(); renderPanelL(); }
        else if (why === "profile") { renderPanelL(); renderPanelR(); renderDock(); renderFlat(); toast("학습 완료 — 프로파일 v" + data.rec.version + (data.delta.length ? " · " + data.delta[0] : ""), { ok: true }); }
        else if (why === "prediction") { renderPanelR(); renderDock(); toast("예측 완료 — 유력 지문 " + data.rec.blueprint.passages.length + "개", { ok: true }); }
        else if (why === "mock") { renderDock(); openPaper(data); toast("모의고사가 완성됐어요 — " + data.questions.length + "문항" + (data.failed.length ? " (" + data.failed.length + "문항은 만들지 못했어요)" : ""), { ok: true }); }
        else if (why === "toast") toast(data.msg, data);
        else if (why === "needKey") openSettings("engine");
        else if (why === "askVideo") toast("배경 영상으로 쓸까요? " + data.name, { action: "배경으로 쓰기", onAction: () => setVideo(data) });
        else if (why === "hover") {}
      });
      requestAnimationFrame(chipsLoop); waveLoop();
    }
    return { init, toast, openSettings, openTeacherSheet, openPaper, openDrawer };
  })();

  // ---- 시작 ----
  window.ORACLE = { APP, UI, API, DB, TEXT, ANALYZE, PROFILE, PREDICT, GENERATE, BUILD };
  function start() {
    UI.init();
    APP.boot().catch(e => { console.error(e); UI.toast("시작하지 못했어요: " + (e && e.message || e), { bad: true, ms: 12000 }); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
</html>
